    .article{user-select:none;-webkit-user-select:none}.primary{width:100%;border:0;border-radius:15px;padding:14px 16px;background:linear-gradient(135deg,var(--blue2),#0ea5e9);color:white;font-weight:900;margin-top:15px}.primary:disabled{opacity:.45}.question{margin-top:13px}.question h4{line-height:1.45;margin:0 0 11px}.question p{white-space:pre-wrap;line-height:1.6;color:#d2deeb}.question-media{min-height:90px;display:grid;place-items:center;margin:0 0 12px;border:1px solid var(--line);border-radius:15px;background:#081525;overflow:hidden;color:var(--muted);font-size:12px}.question-media img,.question-media video{display:block;width:100%;max-height:420px;object-fit:contain;background:#020712}.media-playback-error{width:100%;padding:11px 13px;background:rgba(251,113,133,.1);border-top:1px solid rgba(251,113,133,.25);color:#fecdd3;font-size:11px;line-height:1.5;text-align:left}.option{display:block;border:1px solid var(--line);background:#10223a;border-radius:14px;padding:12px;margin:8px 0;color:#dbeafe}.option input{margin-right:9px;accent-color:var(--blue)}.open-answer{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);background:#10223a;color:var(--text);border-radius:14px;padding:12px;line-height:1.5;outline:none}.open-answer:focus{border-color:rgba(56,189,248,.55)}

<body>
  <div id="screenWatermark" class="screen-watermark hidden" aria-hidden="true"></div>
  <main class="shell">
    <div id="loading" class="loader"><div><div class="spinner"></div><div>Загружаю учебный центр…</div></div></div>
    <div id="app" class="hidden">
      <header class="top">
        <div class="brand"><div class="logo">УЦ</div><div><div class="eyebrow">Support Academy</div><h1>Учебный центр</h1></div></div>
        <div id="avatar" class="avatar">AP</div>
      </header>
      <section id="courseView"></section>
      <section id="resultsView" class="hidden"></section>
      <section id="lessonView" class="hidden"></section>
    </div>
  </main>
  <nav id="nav" class="nav hidden">
    <button data-view="course" class="active">Мой курс</button>
    <button data-view="results">Мои результаты</button>
  </nav>
  <script>
    const BACKEND='https://tg-admin-bot-1k1g.onrender.com';
    const tg=window.Telegram?.WebApp;
    const PREVIEW=['127.0.0.1','localhost'].includes(location.hostname)&&new URLSearchParams(location.search).get('preview')==='1';
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const externalUrl=value=>{try{const url=new URL(String(value||''));return ['https:','http:'].includes(url.protocol)?url.href:''}catch{return ''}};
    let dashboard=null,currentLesson=null,currentBank=null,currentAttempt=null,currentQuestions=[],testReturn='course',mediaObjectUrls=[];
    const profile=tg?.initDataUnsafe?.user||{};
    const initials=value=>String(value||'AP').trim().split(/\s+/).map(x=>x[0]||'').join('').slice(0,2).toUpperCase();
    function renderScreenWatermark(user={}){const telegramId=String(user.telegram_id||profile.id||'').trim();if(!telegramId)return;const nickname=String(user.roster_nickname||user.full_name||user.username||profile.username||[profile.first_name,profile.last_name].filter(Boolean).join(' ')||'Агент поддержки').trim().slice(0,40),label=`${nickname} · ID ${telegramId}`,$layer=$('screenWatermark');$layer.innerHTML=Array.from({length:28},(_,index)=>`<span style="transform:translateY(${index%2?18:-18}px)">${esc(label)}</span>`).join('');$layer.classList.remove('hidden')}
    const statusLabel=status=>({passed:'Пройдено',failed:'Нужна пересдача',retry_required:'Нужна пересдача',pending_review:'На проверке',in_progress:'В процессе',opened:'Изучается',available:'Доступна'}[status]||'Не начато');

    const previewDashboard={user:{telegram_id:'1001',role:'helper',full_name:'Агент поддержки',roster_nickname:'Helper_Nick'},role_label:'Агент поддержки',permissions:['course.study','stats.view_self'],summary:{total:4,passed:1,available:2,progress_percent:25},lessons:[
      {lesson_id:'lecture_1',order:'1',title:'Основы работы агента поддержки',topic:'Роль, регламент и базовый функционал',available:true,progress:{status:'passed',best_percent:'90',attempts_count:'1'}},
      {lesson_id:'lecture_2',order:'2',title:'Выявление нарушений',topic:'Наблюдение, видео и доказательства',available:true,progress:{status:'available',best_percent:'0',attempts_count:'0'}},
      {lesson_id:'lecture_3',order:'3',title:'Сложные ситуации и жалобы',topic:'Конфликты, общение и эскалация',available:false,progress:{}},
      {lesson_id:'lecture_4',order:'4',title:'Практическая смена',topic:'Итоговые ситуационные задачи',available:false,progress:{}}
    ]};
    previewDashboard.tests=[{bank_id:'bank_entry',name:'Входной тест',bank_type:'entry',question_count:'10',case_count:'2',pass_score:'80',available:true,ready:true,last_status:'',attempts_count:0,best_percent:0},{bank_id:'bank_final',name:'Финальный тест',bank_type:'final',question_count:'10',case_count:'2',pass_score:'80',available:false,ready:true,last_status:'',attempts_count:0,best_percent:0}];
    async function previewApi(path,body){
      if(path==='/api/training/bootstrap')return structuredClone(previewDashboard);
      if(path.includes('/submit'))return {status:'passed',percent:100,pass_score:80,wrong:[]};
      if(path.includes('/start')){const bankId=decodeURIComponent(path.split('/').slice(-2)[0]),bank=previewDashboard.tests.find(item=>item.bank_id===bankId)||{bank_id:bankId,name:'Тест после лекции',bank_type:'lesson',pass_score:'80'};return {attempt_id:'preview-attempt',bank,questions:[{question_id:'q1',question_type:'single_choice',text:'Как нужно поступить в показанной ситуации?',option_a:'Первый вариант',option_b:'Второй вариант',option_c:'Передать старшему',option_d:'Игнорировать'}]};}
      if(path.includes('/lesson/')){const id=decodeURIComponent(path.split('/').pop()),item=previewDashboard.lessons.find(x=>x.lesson_id===id);return {lesson:{...item,summary:'Изучите интерактивную статью и закрепите материал тестом.'},blocks:[{block_id:'b1',order:'1',block_type:'heading',title:'Полномочия агента',payload:{}},{block_id:'b2',order:'2',block_type:'custom',title:'Разбор ситуации',payload:{custom_label:'Практика',content:'Куратор самостоятельно формирует этот блок и выбирает его оформление.',tone:'warning',items:['Зафиксировать доказательства','Передать ситуацию старшему']}},{block_id:'b3',order:'3',block_type:'callout',title:'Главное правило',payload:{content:'Не принимайте решение без достаточных доказательств.',tone:'danger'}}],materials:[],questions_count:1,test_bank:{bank_id:'preview-bank',name:'Тест после лекции',bank_type:'lesson',available:true,ready:true,pool_count:1,question_count:1,pass_score:'80'}};}
      throw new Error('Неизвестный preview API');
    }
    async function api(path,body={}){
      if(PREVIEW)return previewApi(path,body);
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
      try{
        const response=await fetch(`${BACKEND}${path}`,{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''},body:JSON.stringify(body),signal:controller.signal});
        const result=await response.json().catch(()=>({status:'error',message:`HTTP ${response.status}`}));
        if(!response.ok||result.status!=='success')throw new Error(result.message||`Ошибка ${response.status}`);
        return result.data;
      }finally{clearTimeout(timer)}
    }
    function showError(title,message){$('loading').innerHTML=`<div class="error"><b>${esc(title)}</b><br><br>${esc(message)}</div>`;$('loading').classList.remove('hidden');$('app').classList.add('hidden');$('nav').classList.add('hidden')}
    function lessonCard(item){const progress=item.progress||{},status=progress.status||'',locked=!item.available,chip=status==='passed'?'Завершена':locked?'Пока закрыта':statusLabel(status);return `<button class="lesson ${locked?'locked':''} ${status==='passed'?'passed':''}" ${locked?'disabled':''} data-lesson="${esc(item.lesson_id)}"><span class="lesson-num">${esc(item.order)}</span><span><h4>${esc(item.title)}</h4><p>${esc(item.topic)}</p><span class="chip">${chip}</span></span></button>`}
    function caseWord(count){const value=Math.abs(Number(count)||0)%100,last=value%10;return value>10&&value<20?'кейсов':last===1?'кейс':last>=2&&last<=4?'кейса':'кейсов'}
    function specialTestCard(item){const blocked=!item.available||!item.ready,pending=item.last_status==='pending_review',caseMode=item.selection_mode==='cases'||Number(item.case_count||0)>0,requiredCases=Number(item.attempt_case_count||item.case_count||item.question_count||0),actualCases=Number(item.cases_pool_count||0),requiredQuestions=Number(item.question_count||10),actualQuestions=Number(item.pool_count??requiredQuestions),missing=caseMode?(actualCases<requiredCases?`Добавьте кейсы: ${actualCases}/${requiredCases}`:'Проверьте состав банка'):(actualQuestions<requiredQuestions?`Добавьте вопросы: ${actualQuestions}/${requiredQuestions}`:'Проверьте состав банка'),status=pending?'На проверке':!item.ready?missing:!item.available?'Откроется по расписанию':item.last_status==='passed'?'Пройден':item.last_status==='failed'?'Доступна пересдача':'Доступен',fill=caseMode?`В попытке: ${requiredCases} ${caseWord(requiredCases)}`:`В банке: ${actualQuestions} из ${requiredQuestions} вопросов`;return `<button class="lesson ${blocked||pending?'locked':''} ${item.last_status==='passed'?'passed':''}" ${blocked||pending?'disabled':''} data-bank="${esc(item.bank_id)}"><span class="lesson-num">${item.bank_type==='entry'?'ВХ':'ФН'}</span><span><h4>${esc(item.name)}</h4><p>${esc(fill)} · проходной балл ${esc(item.pass_score||80)}%</p><span class="chip">${esc(status)}</span></span></button>`}
    function renderCourse(){const s=dashboard.summary,special=(dashboard.tests||[]).filter(item=>item.bank_type!=='lesson').sort((a,b)=>a.bank_type==='entry'?-1:b.bank_type==='entry'?1:0);$('courseView').innerHTML=`<section class="hero"><small>${esc(dashboard.role_label)}</small><h2>Ваш путь к должности администратора</h2><p>Изучайте лекции, разбирайте практические ситуации и закрепляйте знания тестами.</p><div class="progress-row"><div><div class="progress-value">${s.progress_percent}%</div><div class="progress-label">общий прогресс</div></div><div class="bar"><i style="width:${s.progress_percent}%"></i></div></div></section><section class="metrics"><div class="metric"><b>${s.passed}</b><span>пройдено</span></div><div class="metric"><b>${s.available}</b><span>доступно</span></div><div class="metric"><b>${s.total}</b><span>всего лекций</span></div></section>${special.length?`<div class="section-head"><h3>Контрольные тесты</h3><span>персональные вопросы</span></div><div class="lessons">${special.map(specialTestCard).join('')}</div>`:''}<div class="section-head"><h3>Программа курса</h3><span>личное расписание</span></div><div class="lessons">${dashboard.lessons.map(lessonCard).join('')}</div>`;

    function switchView(name){['course','results','lesson'].forEach(view=>$(`${view}View`).classList.toggle('hidden',view!==name));document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('active',button.dataset.view===name));$('nav').classList.toggle('hidden',name==='lesson');if(name==='results')renderResults();window.scrollTo({top:0,behavior:'smooth'})}
    function materialHtml(item){const labels={document:'ФАЙЛ',video:'ВИДЕО',photo:'ФОТО',link:'ССЫЛКА',text:'ТЕКСТ'},type=item.material_type||'document',url=externalUrl(item.url),downloadable=Boolean(item.material_id&&item.telegram_file_id);return `<div class="material"><span class="material-type">${labels[type]||'ФАЙЛ'}</span><div><b>${esc(item.title||'Материал')}</b><small>${type==='link'?'Внешняя ссылка':type==='text'?esc(item.text):'Файл доступен для скачивания'}</small></div>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" data-url="${esc(url)}">Открыть ↗</a>`:downloadable?`<button type="button" class="material-action" data-download="${esc(item.material_id)}">Скачать ↓</button>`:''}</div>`}
    function articleMediaIds(payload,type){const ids=[];if(type==='video'&&Array.isArray(payload.media_ids)){payload.media_ids.forEach(value=>{const id=String(value||'').trim();if(id&&!ids.includes(id))ids.push(id)})}const legacy=String(payload.media_id||'').trim();if(legacy&&!ids.includes(legacy))ids.unshift(legacy);return ids.slice(0,20)}
    function articleMediaHtml(payload,type){const mediaIds=articleMediaIds(payload,type);if(!mediaIds.length)return '';if(type!=='video'||mediaIds.length===1)return `<div class="protected-media" data-article-media="${esc(mediaIds[0])}" data-media-type="${esc(type)}">Подготавливаю защищённое медиа…</div>`;const slides=mediaIds.map((mediaId,index)=>`<div class="protected-media media-series-slide ${index===0?'active':''}" data-article-media="${esc(mediaId)}" data-media-type="video">${index===0?'Подготавливаю защищённое видео…':'Видео загрузится при открытии'}</div>`).join('');return `<div class="media-series" data-media-series data-series-index="0"><div>${slides}</div><div class="media-series-nav"><button type="button" data-series-prev aria-label="Предыдущее видео">←</button><span class="media-series-counter" data-series-counter>Видео 1 из ${mediaIds.length}</span><button type="button" data-series-next aria-label="Следующее видео">→</button></div><p class="media-series-hint">Ролики открываются по очереди</p></div>`}

    function protectedVideoHtml(url,watermark=''){return `<video src="${esc(url)}" controls playsinline preload="auto" controlsList="nodownload noremoteplayback" disablePictureInPicture></video><button type="button" class="native-fullscreen-hitbox" aria-label="Открыть видео на весь экран"></button>${watermark}`}
    function unlockVideoOrientation(){try{tg?.unlockOrientation?.()}catch{}try{screen.orientation?.unlock?.()}catch{}}
    async function lockVideoLandscape(){try{tg?.unlockOrientation?.()}catch{}let landscapeLocked=false;try{await screen.orientation?.lock?.('landscape');landscapeLocked=true}catch{}if(landscapeLocked||String(screen.orientation?.type||'').startsWith('landscape')){try{tg?.lockOrientation?.()}catch{}}}
    function isNativeVideoFullscreen(video){const current=document.fullscreenElement||document.webkitFullscreenElement;return current===video||Boolean(video.webkitDisplayingFullscreen)}
    function closeVideoFullscreen(box){box.classList.remove('native-video-fallback');document.body.classList.remove('native-video-open');if(box.dataset.telegramFullscreen==='1'){try{tg?.exitFullscreen?.()}catch{}delete box.dataset.telegramFullscreen}unlockVideoOrientation()}

    async function requestNativeVideoFullscreen(box,video){unlockVideoOrientation();try{tg?.expand();if(tg?.requestFullscreen&&!tg?.isFullscreen){tg.requestFullscreen();box.dataset.telegramFullscreen='1'}}catch{}try{if(typeof video.webkitEnterFullscreen==='function'&&video.webkitSupportsFullscreen!==false){video.webkitEnterFullscreen();await new Promise(resolve=>setTimeout(resolve,250));if(isNativeVideoFullscreen(video))return}}catch{}try{const request=video.requestFullscreen||video.webkitRequestFullscreen||video.msRequestFullscreen;if(request){await request.call(video);if(isNativeVideoFullscreen(video))return}}catch{}enterVideoFallback(box)}
    function enableNativeVideoFullscreen(box){const video=box.querySelector('video'),hitbox=box.querySelector('.native-fullscreen-hitbox');if(!video||!hitbox)return;const enter=()=>lockVideoLandscape(),exit=()=>closeVideoFullscreen(box);hitbox.onclick=event=>{event.preventDefault();event.stopPropagation();if(box.classList.contains('native-video-fallback')){closeVideoFullscreen(box);return}if(!isNativeVideoFullscreen(video))requestNativeVideoFullscreen(box,video)};video.addEventListener('webkitbeginfullscreen',enter);video.addEventListener('webkitendfullscreen',exit);video.addEventListener('error',()=>{if(box.querySelector('.media-playback-error'))return;const message=video.error?.code===4?'Telegram не поддерживает формат этого видео. Перезагрузите файл в MP4 с кодеком H.264 и звуком AAC.':'Не удалось загрузить видео из хранилища. Закройте тест и откройте его снова.';box.insertAdjacentHTML('beforeend',`<div class="media-playback-error">${esc(message)}</div>`)})}
    function handleNativeFullscreenChange(){const current=document.fullscreenElement||document.webkitFullscreenElement,video=current?.matches?.('video')?current:current?.querySelector?.('video');if(video){lockVideoLandscape();return}document.querySelectorAll('.protected-media[data-telegram-fullscreen],.protected-media.native-video-fallback').forEach(closeVideoFullscreen);unlockVideoOrientation()}
    async function loadArticleMediaBox(box){if(!box||box.dataset.mediaLoaded==='1'||box.dataset.mediaLoading==='1')return;box.dataset.mediaLoading='1';try{const data=await api(`/api/training/media/${encodeURIComponent(box.dataset.articleMedia)}/view-link`),url=externalUrl(data.url);if(!url)throw new Error('Медиа недоступно');const watermark=`<span class="media-watermark">${esc(data.watermark||'Учебный центр')}</span>`;box.innerHTML=data.media_type==='video'?protectedVideoHtml(url,watermark):`<img src="${esc(url)}" alt="Материал лекции" draggable="false">${watermark}`;box.dataset.mediaLoaded='1';if(data.media_type==='video')enableNativeVideoFullscreen(box);box.oncontextmenu=event=>event.preventDefault();box.ondragstart=event=>event.preventDefault()}catch(error){box.textContent=error.message}finally{delete box.dataset.mediaLoading}}
    function showMediaSeriesSlide(series,nextIndex){const slides=[...series.querySelectorAll('.media-series-slide')];if(!slides.length)return;const index=(nextIndex+slides.length)%slides.length;slides.forEach((slide,position)=>{const active=position===index;slide.classList.toggle('active',active);if(!active)slide.querySelector('video')?.pause()});series.dataset.seriesIndex=String(index);const counter=series.querySelector('[data-series-counter]');if(counter)counter.textContent=`Видео ${index+1} из ${slides.length}`;loadArticleMediaBox(slides[index])}

    async function downloadMaterial(materialId,button){const original=button.textContent;button.disabled=true;button.textContent='Открываю…';try{const data=await api(`/api/training/material/${encodeURIComponent(materialId)}/download-link`),url=externalUrl(new URL(data.url,BACKEND).href);if(!url)throw new Error('Не удалось подготовить ссылку на файл.');if(tg?.openLink)tg.openLink(url,{try_instant_view:false});else window.location.assign(url)}catch(error){tg?.showAlert?.(error.message)}finally{button.disabled=false;button.textContent=original}}
    async function openLesson(id){switchView('lesson');$('lessonView').innerHTML='<div class="loader"><div><div class="spinner"></div>Открываю лекцию…</div></div>';try{const data=await api(`/api/training/lesson/${encodeURIComponent(id)}`),blocks=data.blocks||[],materials=data.materials||[];currentLesson=data.lesson;currentBank=data.test_bank||null;const pending=currentBank?.last_status==='pending_review',testButton=!currentBank?'<button class="primary" disabled>Тест ещё не настроен</button>':!currentBank.ready?'<button class="primary" disabled>Банк вопросов ещё не заполнен</button>':!currentBank.available?'<button class="primary" disabled>Тест пока недоступен</button>':pending?'<button class="primary" disabled>Ответы находятся на проверке</button>':'<button class="primary" id="startTest">Пройти тест</button>';$('lessonView').innerHTML=`<button class="back" id="lessonBack">← К курсу</button><article class="detail"><div class="eyebrow">Лекция ${esc(currentLesson.order)}</div><h2>${esc(currentLesson.title)}</h2><div class="topic">${esc(currentLesson.topic)}</div><p class="summary">${esc(currentLesson.summary)}</p><div class="article">${blocks.map(articleBlockHtml).join('')||'<div class="empty">Содержание лекции ещё готовится.</div>'}</div>${materials.length?`<div class="section-head"><h3>Дополнительные материалы</h3><span>${materials.length}</span></div>${materials.map(materialHtml).join('')}`:''}${testButton}</article>`;$('lessonBack').onclick=()=>switchView('course');document.querySelectorAll('[data-url]').forEach(a=>a.onclick=e=>{if(tg?.openLink){e.preventDefault();tg.openLink(a.dataset.url)}});document.querySelectorAll('[data-download]').forEach(button=>button.onclick=()=>downloadMaterial(button.dataset.download,button));if($('startTest'))$('startTest').onclick=()=>startBankTest(currentBank.bank_id,'lesson');loadArticleMedia()}catch(error){$('lessonView').innerHTML=`<button class="back" onclick="switchView('course')">← К курсу</button><div class="error">${esc(error     function clearQuestionMedia(){mediaObjectUrls.forEach(url=>URL.revokeObjectURL(url));mediaObjectUrls=[]}
    async function loadQuestionMedia(){for(const box of document.querySelectorAll('[data-question-media]')){try{const question=currentQuestions.find(item=>item.question_id===box.dataset.questionMedia)||{},mediaId=box.dataset.mediaId||question.media_id;if(mediaId){const data=await api(`/api/training/media/${encodeURIComponent(mediaId)}/view-link`),url=externalUrl(data.url),watermark=`<span class="media-watermark">${esc(data.watermark||'Учебный центр')}</span>`;if(!url)throw new Error('Медиа недоступно');box.classList.add('protected-media');box.innerHTML=data.media_type==='video'?protectedVideoHtml(url,watermark):`<img src="${esc(url)}" alt="Материал к вопросу" draggable="false">${watermark}`;if(data.media_type==='video')enableNativeVideoFullscreen(box);box.oncontextmenu=event=>event.preventDefault();continue}const response=await fetch(`${BACKEND}/api/training/question/${encodeURIComponent(box.dataset.questionMedia)}/media`,{method:'POST',headers:{'X-Telegram-Init-Data':tg?.initData||''}});if(!response.ok)throw new Error('Медиа недоступно');const blob=await response.blob(),url=URL.createObjectURL(blob);mediaObjectUrls.push(url);if(box.dataset.mediaType==='video'){box.classList.add('protected-media');box.innerHTML=protectedVideoHtml(url);enableNativeVideoFullscreen(box)}else box.innerHTML=`<img src="${url}" alt="Материал к вопросу">`}catch(error){box.textContent=error.message}}}
    async function startBankTest(bankId,returnTo='course'){testReturn=returnTo;if(returnTo==='course')currentLesson=null;switchView('lesson');$('lessonView').innerHTML='<div class="loader"><div><div class="spinner"></div>Формирую персональный тест…</div></div>';try{const data=await api(`/api/training/test/${encodeURIComponent(bankId)}/start`);currentAttempt=data;currentBank=data.bank;currentQuestions=data.questions||[];renderTest()}catch(error){$('lessonView').innerHTML=`<button class="back" id="testStartBack">← ${returnTo==='lesson'?'К лекции':'К курсу'}</button><div class="error">${esc(error.message)}</div>`;$('testStartBack').onclick=()=>returnTo==='lesson'&&currentLesson?openLesson(currentLesson.lesson_id):switchView('course')}}
    function renderTest(){clearQuestionMedia();const renderedCases=new Set(),questions=currentQuestions.map((q,index)=>{let caseHtml='';if(q.case?.case_id&&!renderedCases.has(q.case.case_id)){renderedCases.add(q.case.case_id);const caseMedia=q.case.media_id?`<div class="question-media" data-question-media="case-${esc(q.case.case_id)}" data-media-id="${esc(q.case.media_id)}">Загружаю материал кейса…</div>`:'';caseHtml=`<div class="panel question"><div class="eyebrow">Ситуационный кейс</div><h3>${esc(q.case.title||'Ситуация')}</h3><p>${esc(q.case.description||'')}</p>${caseMedia}</div>`}const media=q.has_media?`<div class="question-media" data-question-media="${esc(q.question_id)}" data-media-type="${esc(q.media_type)}" data-media-id="${esc(q.media_id||'')}">Загружаю материал…</div>`:'',field=q.question_type==='open'?`<textarea class="open-answer" name="${esc(q.question_id)}" maxlength="4000" placeholder="Введите развёрнутый ответ"></textarea>`:['a','b','c','d'].filter(key=>q[`option_${key}`]).map(key=>`<label class="option"><input type="radio" name="${esc(q.question_id)}" value="${key.toUpperCase()}">${key.toUpperCase()}. ${esc(q[`option_${key}`])}</label>`).join('');return `${caseHtml}<div class="panel question"><h4>${index+1}. ${esc(q.text)}</h4>${media}${field}</div>`}).join('');const questionLabel=currentQuestions.length===1?'вопрос':'вопросов',backLabel=testReturn==='lesson'?'К лекции':'К курсу';$('lessonView').innerHTML=`<button class="back" id="testBack">← ${backLabel}</button><div class="section-head"><h3>${esc(currentBank?.name||'Тест')}</h3><span>${currentQuestions.length} ${questionLabel}</span></div><form id="testForm">${questions}<button class="primary" type="submit">Завершить тест</button></form>`;$('testBack').onclick=()=>{clearQuestionMedia();testReturn==='lesson'&&currentLesson?openLesson(currentLesson.lesson_id):switchView('course')};$('testForm').onsubmit=submitTest;loadQuestionMedia()}
    async function submitTest(event){event.preventDefault();const button=event.currentTarget.querySelector('button[type=submit]'),answers={};for(const q of currentQuestions){const selected=q.question_type==='open'?event.currentTarget.querySelector(`textarea[name="${CSS.escape(q.question_id)}"]`):event.currentTarget.querySelector(`input[name="${CSS.escape(q.question_id)}"]:checked`),value=selected?.value?.trim();if(!value){tg?.showAlert?.('Ответьте на все вопросы.');return}answers[q.question_id]=value}button.disabled=true;button.textContent='Отправляю…';try{const result=await api(`/api/training/attempt/${encodeURIComponent(currentAttempt.attempt_id)}/submit`,{answers});clearQuestionMedia();if(result.pending_review){$('lessonView').innerHTML=`<div class="panel result"><h2>Ответы отправлены на проверку</h2><p>Куратор проверит открытые ответы и сообщит итоговый результат.</p><button class="primary" id="afterTest">Вернуться к курсу</button></div>`;$('afterTest').onclick=async()=>{await load();switchView('course')};return}const failed=result.status!=='passed',lessonCompleted=!failed&&currentBank?.bank_type==='lesson',wrong=(result.wrong||[]).map(item=>`<div class="wrong"><b>${esc(item.text)}</b><br>${esc(item.explanation||'Повторите соответствующий раздел курса.')}</div>`).join(''),backToLesson=failed&&testReturn==='lesson'&&currentLesson,completionNote=lessonCompleted?'<p>Лекция завершена и закрыта.</p>':'';$('lessonView').innerHTML=`<div class="panel result ${failed?'failed':''}"><div class="big">${result.percent}%</div><h2>${failed?'Нужна пересдача':'Тест пройден'}</h2><p>Проходной балл: ${result.pass_score}%</p>${completionNote}${wrong}<button class="primary" id="afterTest">${backToLesson?'Вернуться к лекции':'Вернуться к курсу'}</button></div>`;$('afterTest').onclick=async()=>{const lessonId=currentLesson?.lesson_id;await load();if(backToLesson&&lessonId)openLesson(lessonId);else switchView('course')}}catch(error){button.disabled=false;button.textContent='Завершить тест';tg?.showAlert?.(error.message)}}
    async function load(){if(!PREVIEW&&!tg?.initData)throw new Error('Откройте учебный центр кнопкой из Telegram-бота.');dashboard=await api('/api/training/bootstrap');$('avatar').textContent=initials([profile.first_name,profile.last_name].filter(Boolean).join(' ')||dashboard.user.full_name);renderScreenWatermark(dashboard.user);renderCourse();renderResults();$('loading').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden')}
