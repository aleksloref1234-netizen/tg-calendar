<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Редактор WebApp · Admin Control BOT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#0b1220;--card:#172238;--card2:#1b2940;--line:rgba(148,163,184,.17);--text:#f8fafc;--sub:#91a0b8;--blue:#38bdf8;--green:#34d399;--red:#fb7185;--yellow:#fbbf24}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background-color:var(--bg);background-image:linear-gradient(rgba(119,140,163,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(119,140,163,.055) 1px,transparent 1px),radial-gradient(850px 420px at 100% -100px,rgba(56,189,248,.13),transparent 65%);background-size:28px 28px,28px 28px,auto}
    main{width:min(900px,100%);margin:0 auto;padding:16px}.hero,.summary,.page,.empty,.error{border:1px solid var(--line);background:linear-gradient(135deg,rgba(30,41,59,.97),rgba(20,31,50,.99));border-radius:18px}.hero{position:relative;overflow:hidden;padding:20px;margin-bottom:13px}.hero:after{content:"";position:absolute;right:-55px;top:-75px;width:190px;height:190px;border:1px solid rgba(56,189,248,.17);border-radius:50%;box-shadow:0 0 0 28px rgba(56,189,248,.04),0 0 0 56px rgba(56,189,248,.025)}.eyebrow{position:relative;z-index:1;color:var(--blue);font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}h1{position:relative;z-index:1;margin:8px 0 0;font-size:25px}.subtitle{position:relative;z-index:1;max-width:620px;margin:9px 0 0;color:var(--sub);font-size:13px;line-height:1.48}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;overflow:hidden;margin-bottom:13px}.metric{padding:14px;background:rgba(15,23,42,.24)}.metric-label{color:var(--sub);font-size:10px}.metric-value{margin-top:5px;color:var(--blue);font-size:23px;font-weight:850}.metric-value.green{color:var(--green)}.metric-value.red{color:var(--red)}
    .toolbar{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:13px}.search,.reset{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit}.search{width:100%;padding:0 13px;outline:none}.search:focus{border-color:rgba(56,189,248,.72)}.reset{padding:0 14px;color:var(--sub);cursor:pointer}.reset:active{transform:scale(.98)}
    .pages{display:grid;gap:10px}.page{overflow:hidden}.page-head{display:flex;align-items:center;gap:12px;width:100%;padding:15px;border:0;background:transparent;color:var(--text);text-align:left;cursor:pointer}.page-icon{display:grid;place-items:center;width:37px;height:37px;flex:none;border-radius:11px;background:rgba(56,189,248,.11);color:var(--blue);font-size:14px;font-weight:850}.page-main{min-width:0;flex:1}.page-name{font-size:15px;font-weight:800}.page-status{margin-top:4px;color:var(--sub);font-size:10px}.page-count{padding:5px 8px;border:1px solid rgba(52,211,153,.25);border-radius:99px;background:rgba(52,211,153,.07);color:var(--green);font-size:10px;font-weight:750}.page-count.off{border-color:rgba(251,113,133,.25);background:rgba(251,113,133,.07);color:var(--red)}.chevron{color:var(--sub);font-size:17px;transition:transform .18s}.page.open .chevron{transform:rotate(180deg)}
    .page-body{display:none;border-top:1px solid var(--line);padding:6px 13px 13px}.page.open .page-body{display:block}.page-actions{display:flex;gap:7px;padding:8px 0 10px}.page-action{flex:1;padding:8px;border:1px solid var(--line);border-radius:9px;background:rgba(15,23,42,.3);color:var(--sub);font:inherit;font-size:11px;cursor:pointer}.page-action.show{color:var(--green)}.page-action.hide{color:var(--red)}
    .block{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid rgba(148,163,184,.1)}.block:first-of-type{border-top:0}.block-main{min-width:0;flex:1}.block-name{font-size:13px;font-weight:700}.block-note{margin-top:4px;color:var(--sub);font-size:10px;line-height:1.35}.switch{position:relative;width:46px;height:27px;flex:none}.switch input{position:absolute;opacity:0;pointer-events:none}.slider{position:absolute;inset:0;border:1px solid rgba(148,163,184,.25);border-radius:99px;background:#26344a;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#94a3b8;transition:.2s}.switch input:checked+.slider{border-color:rgba(52,211,153,.5);background:rgba(16,185,129,.28)}.switch input:checked+.slider:before{transform:translateX(19px);background:var(--green)}.switch input:disabled+.slider{opacity:.5;cursor:wait}
    .toast{position:fixed;z-index:5;left:50%;bottom:18px;max-width:calc(100% - 32px);padding:10px 14px;border:1px solid rgba(52,211,153,.3);border-radius:11px;background:#123328;color:#bbf7d0;font-size:12px;box-shadow:0 14px 35px rgba(2,6,23,.45);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}.toast.error{border-color:rgba(251,113,133,.35);background:#3b1721;color:#fecdd3}.empty,.error{padding:26px 17px;text-align:center;color:var(--sub);font-size:12px;line-height:1.45}.error strong{display:block;margin-bottom:7px;color:var(--red)}#loading{padding:55px 20px;color:var(--sub);text-align:center;font-size:13px}
    @media(max-width:520px){main{padding:12px}.summary{grid-template-columns:repeat(3,1fr)}.metric{padding:11px 9px}.metric-value{font-size:19px}.toolbar{grid-template-columns:1fr}.reset{width:100%}}
  </style>
</head>
<body>
  <main>
    <div id="loading">Загружаю структуру WebApp…</div>
    <section id="content" hidden>
      <header class="hero"><div class="eyebrow">Admin Control BOT</div><h1>Редактор WebApp</h1><p class="subtitle">Управляйте отображением аналитики без изменения кода. Скрытые блоки продолжают собирать данные и могут быть возвращены в любой момент.</p></header>
      <section class="summary"><div class="metric"><div class="metric-label">Страниц</div><div class="metric-value" id="pages-count">0</div></div><div class="metric"><div class="metric-label">Видно блоков</div><div class="metric-value green" id="enabled-count">0</div></div><div class="metric"><div class="metric-label">Скрыто</div><div class="metric-value red" id="disabled-count">0</div></div></section>
      <div class="toolbar"><input class="search" id="search" type="search" autocomplete="off" placeholder="Найти страницу или блок"><button class="reset" id="reset" type="button">Включить все блоки</button></div>
      <section class="pages" id="pages"></section>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    const API_URL='https://tg-admin-bot-1k1g.onrender.com/api/webapp/settings';
    const tg=window.Telegram?.WebApp;
    let pages=[];let query='';const openPages=new Set();
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const initials=value=>String(value||'?').split(/[_\s]+/).map(part=>part[0]||'').join('').slice(0,2).toUpperCase();
    function toast(message,isError=false){const el=$('toast');el.textContent=message;el.classList.toggle('error',isError);el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
    function totals(){const blocks=pages.flatMap(page=>page.blocks||[]);$('pages-count').textContent=pages.length;$('enabled-count').textContent=blocks.filter(block=>block.enabled).length;$('disabled-count').textContent=blocks.filter(block=>!block.enabled).length}
    function render(){totals();const needle=query.trim().toLowerCase();const filtered=pages.map(page=>({...page,blocks:(page.blocks||[]).filter(block=>!needle||`${page.label} ${block.label}`.toLowerCase().includes(needle))})).filter(page=>page.blocks.length);$('pages').innerHTML=filtered.length?filtered.map((page,index)=>{const isOpen=openPages.has(page.key)||Boolean(needle)||(index===0&&!openPages.size);const enabled=page.blocks.filter(block=>block.enabled).length;return `<article class="page ${isOpen?'open':''}" data-page="${esc(page.key)}"><button class="page-head" type="button" data-open="${esc(page.key)}"><span class="page-icon">${esc(initials(page.label))}</span><span class="page-main"><span class="page-name">${esc(page.label)}</span><span class="page-status">${enabled} из ${page.blocks.length} блоков отображаются</span></span><span class="page-count ${enabled?'':'off'}">${enabled}/${page.blocks.length}</span><span class="chevron">⌄</span></button><div class="page-body"><div class="page-actions"><button class="page-action show" type="button" data-page-action="show" data-page="${esc(page.key)}">Показать всё</button><button class="page-action hide" type="button" data-page-action="hide" data-page="${esc(page.key)}">Скрыть всё</button></div>${page.blocks.map(block=>`<div class="block"><div class="block-main"><div class="block-name">${esc(block.label)}</div><div class="block-note">${block.enabled?'Отображается в WebApp':'Скрыт, данные продолжают рассчитываться'}</div></div><label class="switch"><input type="checkbox" data-page="${esc(page.key)}" data-block="${esc(block.key)}" ${block.enabled?'checked':''}><span class="slider"></span></label></div>`).join('')}</div></article>`}).join(''):'<div class="empty">По вашему запросу блоки не найдены.</div>';bind()}
    function bind(){document.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>{const key=button.dataset.open;openPages.has(key)?openPages.delete(key):openPages.add(key);button.closest('.page').classList.toggle('open')}));document.querySelectorAll('input[data-block]').forEach(input=>input.addEventListener('change',async()=>{input.disabled=true;await update({action:'set_block',page:input.dataset.page,block:input.dataset.block,enabled:input.checked},'Настройка сохранена')}));document.querySelectorAll('[data-page-action]').forEach(button=>button.addEventListener('click',async()=>{button.disabled=true;await update({action:'set_page',page:button.dataset.page,enabled:button.dataset.pageAction==='show'},button.dataset.pageAction==='show'?'Все блоки страницы включены':'Блоки страницы скрыты')}))}
    async function request(payload={}){const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg.initData},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok||result.status!=='success')throw new Error(result.message||`HTTP ${response.status}`);return result.data}
    async function update(payload,message){try{const data=await request(payload);pages=data.pages||[];render();toast(message)}catch(error){render();toast(error.message||'Не удалось сохранить настройку',true)}}
    async function load(){if(!tg?.initData){$('loading').innerHTML='<div class="error"><strong>Доступ запрещён</strong>Откройте редактор из раздела «Настройки» Telegram-бота.</div>';return}tg.ready();tg.expand();try{const data=await request();pages=data.pages||[];$('loading').hidden=true;$('content').hidden=false;render()}catch(error){$('loading').innerHTML=`<div class="error"><strong>Не удалось открыть редактор</strong>${esc(error.message||'Повторите попытку позже.')}</div>`}}
    $('search').addEventListener('input',event=>{query=event.target.value;render()});$('reset').addEventListener('click',async()=>{if(!confirm('Включить все блоки на всех WebApp-страницах?'))return;await update({action:'reset_all'},'Все блоки включены')});load();
  </script>
</body>
</html>
