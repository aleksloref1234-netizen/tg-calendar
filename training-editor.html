<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Конструктор курса</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#07101f;--panel:#0d1a2c;--panel2:#11243b;--line:rgba(148,163,184,.18);--text:#f8fafc;--muted:#93a4bb;--blue:#38bdf8;--blue2:#2563eb;--green:#34d399;--yellow:#fbbf24;--red:#fb7185;--shadow:0 18px 42px rgba(0,0,0,.25)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 88% -12%,rgba(37,99,235,.22),transparent 34%),var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,textarea,select{font:inherit}.hidden{display:none!important}
    .shell{max-width:1040px;margin:0 auto;padding:18px 16px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--blue2),#0ea5e9);font-size:14px;font-weight:900;letter-spacing:.08em}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);font-weight:800}.brand h1{font-size:19px;margin:3px 0 0}.role{padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:rgba(17,36,59,.75);color:var(--muted);font-size:11px}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:rgba(13,26,44,.86);border:1px solid var(--line);border-radius:17px;margin-bottom:18px}.tabs button{border:0;border-radius:12px;padding:11px 8px;background:transparent;color:var(--muted);font-weight:800;font-size:12px}.tabs button.active{background:#183253;color:var(--text)}.badge{display:inline-flex;min-width:19px;height:19px;padding:0 6px;align-items:center;justify-content:center;border-radius:99px;background:rgba(56,189,248,.13);color:var(--blue);font-size:10px;margin-left:5px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}.toolbar h2{font-size:20px;margin:0}.toolbar p{color:var(--muted);font-size:12px;margin:4px 0 0}.button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.button.primary{background:linear-gradient(135deg,var(--blue2),#0ea5e9);color:white}.button.secondary{background:#152b47;color:var(--text);border:1px solid var(--line)}.button.danger{background:rgba(251,113,133,.1);color:#fecdd3;border:1px solid rgba(251,113,133,.2)}.button.small{padding:8px 10px;font-size:11px}.button:disabled{opacity:.45;cursor:wait}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:linear-gradient(145deg,rgba(17,36,59,.95),rgba(11,24,41,.96));border:1px solid var(--line);border-radius:18px;padding:16px}.lesson-card{cursor:pointer}.lesson-card:hover{border-color:rgba(56,189,248,.35)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:15px;font-weight:850;line-height:1.35}.muted{color:var(--muted);font-size:12px;line-height:1.5}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tag{display:inline-flex;padding:6px 8px;border-radius:9px;background:rgba(56,189,248,.09);color:#bae6fd;font-size:10px;font-weight:800}.tag.ok{background:rgba(52,211,153,.09);color:#a7f3d0}.tag.warn{background:rgba(251,191,36,.09);color:#fde68a}
    .panel{background:rgba(13,26,44,.9);border:1px solid var(--line);border-radius:19px;padding:17px;margin-bottom:14px}.panel h3{font-size:16px;margin:0 0 14px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#cbd5e1;font-weight:750}.input{width:100%;border:1px solid var(--line);border-radius:12px;background:#0b1829;color:var(--text);padding:11px 12px;outline:none}.input:focus{border-color:rgba(56,189,248,.55)}textarea.input{min-height:100px;resize:vertical;line-height:1.5}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
    .list{display:grid;gap:9px}.list-item{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#10223a}.type{min-width:58px;text-align:center;padding:7px 6px;border-radius:9px;background:rgba(56,189,248,.1);color:var(--blue);font-size:9px;font-weight:900}.list-main{flex:1;min-width:0}.list-main b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis}.list-main small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.empty{text-align:center;color:var(--muted);padding:32px 14px;border:1px dashed var(--line);border-radius:16px}.back{border:0;background:transparent;color:var(--blue);padding:5px 0 12px;font-weight:800;cursor:pointer}
    .modal{position:fixed;inset:0;background:rgba(2,8,18,.76);backdrop-filter:blur(10px);display:grid;place-items:center;padding:15px;z-index:30}.modal-card{width:min(680px,100%);max-height:92vh;overflow:auto;background:#0d1a2c;border:1px solid var(--line);border-radius:21px;padding:18px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.modal-head h3{margin:0}.close{border:0;background:#172b46;color:var(--text);border-radius:10px;width:34px;height:34px;cursor:pointer}
    .review{margin-bottom:12px}.answer{padding:12px;border-radius:13px;background:#0b1829;border:1px solid var(--line);margin-top:9px;white-space:pre-wrap;line-height:1.5;font-size:13px}.criteria{color:var(--muted);font-size:11px;margin-top:8px}.decision{display:flex;gap:8px;margin-top:10px}.decision label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:11px;padding:9px;font-size:11px;cursor:pointer}.decision input{accent-color:var(--blue)}
    .loader{min-height:65vh;display:grid;place-items:center;text-align:center;color:var(--muted)}.spinner{width:38px;height:38px;border:3px solid rgba(148,163,184,.18);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}.error{background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.22);border-radius:16px;padding:15px;color:#fecdd3}
    @media(max-width:700px){.shell{padding:12px 12px 60px}.role{display:none}.grid,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{align-items:flex-start}.toolbar .button{flex:0 0 auto}.list-item{align-items:flex-start}.list-item .actions{margin:0;display:grid}.tabs{position:sticky;top:6px;z-index:15;backdrop-filter:blur(16px)}}
  </style>
</head>
<body>
  <main class="shell">
    <div id="loading" class="loader"><div><div class="spinner"></div><div>Загружаю конструктор курса…</div></div></div>
    <div id="app" class="hidden">
      <header class="top"><div class="brand"><div class="logo">УЦ</div><div><div class="eyebrow">Support Academy</div><h1>Конструктор курса</h1></div></div><div id="role" class="role"></div></header>
      <nav class="tabs"><button data-tab="lessons" class="active">Лекции</button><button data-tab="tests">Тесты</button><button data-tab="reviews">Проверка <span id="reviewBadge" class="badge">0</span></button></nav>
      <section id="content"></section>
    </div>
  </main>
  <div id="modal" class="modal hidden"></div>
  <script>
    const BACKEND='https://tg-admin-bot-1k1g.onrender.com';
    const tg=window.Telegram?.WebApp;
    const PREVIEW=['127.0.0.1','localhost'].includes(location.hostname)&&new URLSearchParams(location.search).get('preview')==='1';
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const labels={published:'Опубликована',draft:'Черновик',archived:'Архив',auto:'По расписанию',open:'Открыта',closed:'Закрыта',single_choice:'С вариантами'};
    let state={lessons:[],pending_reviews_count:0},activeTab='lessons',selectedLessonId='',detail=null,reviews=[];
    const previewState={user:{telegram_id:'1001',role:'curator'},role_label:'Куратор',pending_reviews_count:1,lessons:[{lesson_id:'lecture_1',order:'1',title:'Основы работы агента поддержки',topic:'Роль, регламент и базовый функционал',summary:'Каркас первой лекции.',unlock_mode:'auto',unlock_day:'2',publication_status:'published',global_access:'auto',pass_score:'80',materials_count:2,questions_count:2,open_questions_count:1},{lesson_id:'lecture_2',order:'2',title:'Выявление нарушений',topic:'Наблюдение и доказательства',summary:'',unlock_mode:'auto',unlock_day:'4',publication_status:'draft',global_access:'auto',pass_score:'80',materials_count:0,questions_count:0,open_questions_count:0}]};
    const previewDetail={lesson:previewState.lessons[0],materials:[{material_id:'m1',material_type:'document',title:'Регламент.pdf',active:'true'},{material_id:'m2',material_type:'link',title:'Дополнительный материал',active:'true'}],questions:[{question_id:'q1',question_type:'single_choice',text:'Как следует поступить в ситуации?',option_a:'Вариант A',option_b:'Вариант B',option_c:'Вариант C',option_d:'Вариант D',correct_option:'B',explanation:'Пояснение',points:'1',active:'true'},{question_id:'q2',question_type:'open',text:'Опишите порядок эскалации спорной ситуации.',explanation:'Указаны фиксация, обращение к старшему и передача доказательств.',points:'2',active:'true'}]};
    async function previewApi(path,body){if(path.endsWith('/bootstrap'))return structuredClone(previewState);if(path.includes('/lesson/')&&!path.endsWith('/save'))return structuredClone(previewDetail);if(path.endsWith('/reviews'))return [{attempt:{attempt_id:'a1',telegram_id:'2001',lesson_id:'lecture_1',completed_at:'2026-08-14T10:00:00Z'},user:{full_name:'Агент поддержки',telegram_id:'2001'},lesson:{title:'Основы работы агента поддержки'},items:[{question_id:'q2',text:'Опишите порядок эскалации спорной ситуации.',answer:'Зафиксирую доказательства и передам ситуацию старшему администратору.',criteria:'Указаны фиксация, обращение к старшему и передача доказательств.',points:2}]}];return body instanceof FormData?{}:(body||{})}
    async function api(path,body={}){if(PREVIEW)return previewApi(path,body);const isForm=body instanceof FormData,response=await fetch(`${BACKEND}${path}`,{method:'POST',headers:{...(isForm?{}:{'Content-Type':'application/json'}),'X-Telegram-Init-Data':tg?.initData||''},body:isForm?body:JSON.stringify(body)}),result=await response.json().catch(()=>({status:'error',message:`HTTP ${response.status}`}));if(!response.ok||result.status!=='success')throw new Error(result.message||`Ошибка ${response.status}`);return result.data}
    function setBusy(button,busy,text='Сохранение…'){if(!button)return;button.disabled=busy;if(busy){button.dataset.original=button.textContent;button.textContent=text}else button.textContent=button.dataset.original||button.textContent}
    function showError(message){$('content').innerHTML=`<div class="error">${esc(message)}</div>`}
    function lessonTags(item){return `<div class="meta"><span class="tag ${item.publication_status==='published'?'ok':'warn'}">${esc(labels[item.publication_status]||item.publication_status)}</span><span class="tag">Материалов: ${esc(item.materials_count||0)}</span><span class="tag">Вопросов: ${esc(item.questions_count||0)}</span>${item.open_questions_count?`<span class="tag">Открытых: ${esc(item.open_questions_count)}</span>`:''}</div>`}
    function renderLessons(){selectedLessonId='';detail=null;$('content').innerHTML=`<div class="toolbar"><div><h2>Лекции</h2><p>Структура, расписание, материалы и публикация курса.</p></div><button class="button primary" id="newLesson">Новая лекция</button></div><div class="grid">${state.lessons.map(item=>`<article class="card lesson-card" data-lesson="${esc(item.lesson_id)}"><div class="row"><div class="title">${esc(item.order)}. ${esc(item.title)}</div><span class="muted">→</span></div><p class="muted">${esc(item.topic)}</p>${lessonTags(item)}</article>`).join('')||'<div class="empty">Лекции ещё не созданы.</div>'}</div>`;document.querySelectorAll('[data-lesson]').forEach(card=>card.onclick=()=>openLessonEditor(card.dataset.lesson));$('newLesson').onclick=()=>renderLessonForm({})}
    function renderLessonForm(lesson){const isNew=!lesson.lesson_id;$('content').innerHTML=`<button class="back" id="backLessons">← К списку лекций</button><form id="lessonForm" class="panel"><h3>${isNew?'Новая лекция':'Редактирование лекции'}</h3><input type="hidden" name="lesson_id" value="${esc(lesson.lesson_id||'')}"><div class="form-grid"><div class="field"><label>Порядковый номер</label><input class="input" type="number" min="1" name="order" value="${esc(lesson.order||state.lessons.length+1)}"></div><div class="field"><label>Название</label><input class="input" name="title" maxlength="200" value="${esc(lesson.title||'')}" required></div><div class="field full"><label>Тема</label><input class="input" name="topic" maxlength="500" value="${esc(lesson.topic||'')}" required></div><div class="field full"><label>Краткое описание</label><textarea class="input" name="summary" maxlength="5000">${esc(lesson.summary||'')}</textarea></div><div class="field"><label>Открытие</label><select class="input" name="unlock_mode"><option value="auto" ${lesson.unlock_mode!=='manual'?'selected':''}>По расписанию</option><option value="manual" ${lesson.unlock_mode==='manual'?'selected':''}>Вручную</option></select></div><div class="field"><label>День открытия</label><input class="input" type="number" min="0" name="unlock_day" value="${esc(lesson.unlock_day||0)}"></div><div class="field"><label>Публикация</label><select class="input" name="publication_status"><option value="draft" ${lesson.publication_status!=='published'&&lesson.publication_status!=='archived'?'selected':''}>Черновик</option><option value="published" ${lesson.publication_status==='published'?'selected':''}>Опубликована</option><option value="archived" ${lesson.publication_status==='archived'?'selected':''}>Архив</option></select></div><div class="field"><label>Общий доступ</label><select class="input" name="global_access"><option value="auto" ${lesson.global_access!=='open'&&lesson.global_access!=='closed'?'selected':''}>По расписанию</option><option value="open" ${lesson.global_access==='open'?'selected':''}>Открыть всем</option><option value="closed" ${lesson.global_access==='closed'?'selected':''}>Закрыть всем</option></select></div><div class="field"><label>Проходной балл, %</label><input class="input" type="number" min="1" max="100" name="pass_score" value="${esc(lesson.pass_score||80)}"></div></div><div class="actions"><button class="button primary" type="submit">Сохранить лекцию</button></div></form>${isNew?'':'<section id="materialsSection"></section>'}`;$('backLessons').onclick=renderLessons;$('lessonForm').onsubmit=saveLesson;if(!isNew)renderMaterials()}
    async function saveLesson(event){event.preventDefault();const button=event.submitter,data=Object.fromEntries(new FormData(event.currentTarget));setBusy(button,true);try{const saved=await api('/api/training/editor/lesson/save',data);await load();await openLessonEditor(saved.lesson_id)}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function openLessonEditor(id){try{selectedLessonId=id;detail=await api(`/api/training/editor/lesson/${encodeURIComponent(id)}`);renderLessonForm(detail.lesson)}catch(error){showError(error.message)}}
    function renderMaterials(){const items=detail?.materials||[];$('materialsSection').innerHTML=`<div class="toolbar"><div><h2>Материалы</h2><p>Файлы, ссылки и текстовые блоки этой лекции.</p></div><button class="button secondary" id="addMaterial">Добавить</button></div><div class="panel"><div class="list">${items.map(item=>`<div class="list-item"><span class="type">${esc(item.material_type==='document'?'ФАЙЛ':item.material_type==='video'?'ВИДЕО':item.material_type==='photo'?'ФОТО':item.material_type==='link'?'ССЫЛКА':'ТЕКСТ')}</span><div class="list-main"><b>${esc(item.title||'Материал')}</b><small>${String(item.active).toLowerCase()==='false'?'Отключён':'Доступен ученикам'}</small></div><button class="button small secondary" data-material-toggle="${esc(item.material_id)}" data-active="${String(item.active).toLowerCase()!=='false'}">${String(item.active).toLowerCase()==='false'?'Включить':'Отключить'}</button></div>`).join('')||'<div class="empty">Материалы ещё не добавлены.</div>'}</div></div>`;$('addMaterial').onclick=showMaterialModal;document.querySelectorAll('[data-material-toggle]').forEach(button=>button.onclick=()=>toggleMaterial(button))}
    function showMaterialModal(){showModal(`<form id="materialForm"><div class="modal-head"><h3>Новый материал</h3><button type="button" class="close" data-close>×</button></div><input type="hidden" name="lesson_id" value="${esc(selectedLessonId)}"><div class="form-grid"><div class="field"><label>Тип</label><select class="input" name="material_type" id="materialType"><option value="file">Файл</option><option value="link">Ссылка</option><option value="text">Текст</option></select></div><div class="field"><label>Название</label><input class="input" name="title" maxlength="300"></div><div class="field full" id="materialValue"></div></div><div class="actions"><button type="button" class="button secondary" data-close>Отмена</button><button class="button primary" type="submit">Добавить</button></div></form>`);const select=$('materialType'),renderValue=()=>{$('materialValue').innerHTML=select.value==='file'?'<label>Файл до 20 МБ</label><input class="input" type="file" name="file" required>':select.value==='link'?'<label>Ссылка</label><input class="input" type="url" name="url" placeholder="https://" required>':'<label>Текст материала</label><textarea class="input" name="text" required></textarea>'};select.onchange=renderValue;renderValue();$('materialForm').onsubmit=saveMaterial}
    async function saveMaterial(event){event.preventDefault();const button=event.submitter,data=new FormData(event.currentTarget),type=data.get('material_type');if(type!=='file')data.delete('file');setBusy(button,true,'Загрузка…');try{await api('/api/training/editor/material/save',data);closeModal();detail=await api(`/api/training/editor/lesson/${encodeURIComponent(selectedLessonId)}`);renderMaterials();await refreshBootstrap()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function toggleMaterial(button){setBusy(button,true);try{await api(`/api/training/editor/material/${encodeURIComponent(button.dataset.materialToggle)}/toggle`,{active:button.dataset.active!=='true'});detail=await api(`/api/training/editor/lesson/${encodeURIComponent(selectedLessonId)}`);renderMaterials()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    function renderTests(){const id=selectedLessonId||state.lessons[0]?.lesson_id||'';$('content').innerHTML=`<div class="toolbar"><div><h2>Редактор теста</h2><p>Вопросы с вариантами и открытые ответы.</p></div><div><button class="button secondary small" id="addClosed" ${id?'':'disabled'}>Закрытый вопрос</button> <button class="button primary small" id="addOpen" ${id?'':'disabled'}>Открытый вопрос</button></div></div><div class="panel"><div class="field"><label>Лекция</label><select class="input" id="testLesson">${state.lessons.map(item=>`<option value="${esc(item.lesson_id)}" ${item.lesson_id===id?'selected':''}>${esc(item.order)}. ${esc(item.title)}</option>`).join('')}</select></div></div><section id="questionsSection"></section>`;if(!id){$('questionsSection').innerHTML='<div class="empty">Сначала создайте лекцию.</div>';return}selectedLessonId=id;$('testLesson').onchange=async e=>{selectedLessonId=e.target.value;await loadQuestions()};$('addClosed').onclick=()=>showQuestionModal('single_choice');$('addOpen').onclick=()=>showQuestionModal('open');loadQuestions()}
    async function loadQuestions(){try{detail=await api(`/api/training/editor/lesson/${encodeURIComponent(selectedLessonId)}`);const items=detail.questions||[];$('questionsSection').innerHTML=`<div class="panel"><div class="list">${items.map((item,index)=>`<div class="list-item"><span class="type">${item.question_type==='open'?'ОТКРЫТЫЙ':'ВЫБОР'}</span><div class="list-main"><b>${index+1}. ${esc(item.text)}</b><small>${item.question_type==='open'?'Проверяет куратор':`Правильный ответ: ${esc(item.correct_option)}`} · ${esc(item.points||1)} балл.</small></div><button class="button small secondary" data-edit-question="${esc(item.question_id)}">Изменить</button><button class="button small secondary" data-question-toggle="${esc(item.question_id)}" data-active="${String(item.active).toLowerCase()!=='false'}">${String(item.active).toLowerCase()==='false'?'Включить':'Отключить'}</button></div>`).join('')||'<div class="empty">Вопросы ещё не добавлены.</div>'}</div></div>`;document.querySelectorAll('[data-edit-question]').forEach(button=>button.onclick=()=>showQuestionModal('',detail.questions.find(item=>item.question_id===button.dataset.editQuestion)));document.querySelectorAll('[data-question-toggle]').forEach(button=>button.onclick=()=>toggleQuestion(button))}catch(error){showError(error.message)}}
    function showQuestionModal(type,item={}){type=type||item.question_type||'single_choice';const open=type==='open';showModal(`<form id="questionForm"><div class="modal-head"><h3>${item.question_id?'Редактирование':'Новый'} ${open?'открытый вопрос':'вопрос с вариантами'}</h3><button type="button" class="close" data-close>×</button></div><input type="hidden" name="lesson_id" value="${esc(selectedLessonId)}"><input type="hidden" name="question_id" value="${esc(item.question_id||'')}"><input type="hidden" name="question_type" value="${esc(type)}"><div class="form-grid"><div class="field full"><label>Текст вопроса</label><textarea class="input" name="text" maxlength="2000" required>${esc(item.text||'')}</textarea></div>${open?`<div class="field full"><label>Критерии проверки для куратора</label><textarea class="input" name="explanation" maxlength="3000" placeholder="Что должен содержать правильный ответ">${esc(item.explanation||'')}</textarea></div>`:`${['a','b','c','d'].map(letter=>`<div class="field"><label>Вариант ${letter.toUpperCase()}</label><input class="input" name="option_${letter}" value="${esc(item[`option_${letter}`]||'')}" required></div>`).join('')}<div class="field"><label>Правильный вариант</label><select class="input" name="correct_option">${'ABCD'.split('').map(letter=>`<option value="${letter}" ${item.correct_option===letter?'selected':''}>${letter}</option>`).join('')}</select></div><div class="field full"><label>Пояснение после ошибки</label><textarea class="input" name="explanation" maxlength="3000">${esc(item.explanation||'')}</textarea></div>`}<div class="field"><label>Баллы</label><input class="input" type="number" min="1" max="100" name="points" value="${esc(item.points||1)}"></div></div><div class="actions"><button type="button" class="button secondary" data-close>Отмена</button><button class="button primary" type="submit">Сохранить вопрос</button></div></form>`);$('questionForm').onsubmit=saveQuestion}
    async function saveQuestion(event){event.preventDefault();const button=event.submitter,data=Object.fromEntries(new FormData(event.currentTarget));setBusy(button,true);try{await api('/api/training/editor/question/save',data);closeModal();await loadQuestions();await refreshBootstrap()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function toggleQuestion(button){setBusy(button,true);try{await api(`/api/training/editor/question/${encodeURIComponent(button.dataset.questionToggle)}/toggle`,{active:button.dataset.active!=='true'});await loadQuestions()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function renderReviews(){selectedLessonId='';$('content').innerHTML='<div class="loader"><div><div class="spinner"></div>Загружаю ответы…</div></div>';try{reviews=await api('/api/training/editor/reviews');$('content').innerHTML=`<div class="toolbar"><div><h2>Проверка открытых ответов</h2><p>Оцените каждый ответ и завершите попытку.</p></div></div>${reviews.map(renderReviewCard).join('')||'<div class="empty">Ответов, ожидающих проверки, нет.</div>'}`;document.querySelectorAll('[data-review-form]').forEach(form=>form.onsubmit=submitReview)}catch(error){showError(error.message)}}
    function renderReviewCard(item){const attempt=item.attempt,user=item.user||{},lesson=item.lesson||{};return `<form class="panel review" data-review-form="${esc(attempt.attempt_id)}"><div class="row"><div><div class="title">${esc(user.full_name||user.username||user.telegram_id)}</div><div class="muted">${esc(lesson.title||attempt.lesson_id)}</div></div><span class="tag warn">На проверке</span></div>${item.items.map((answer,index)=>`<section><h3>${index+1}. ${esc(answer.text)}</h3><div class="answer">${esc(answer.answer)}</div><div class="criteria"><b>Критерии:</b> ${esc(answer.criteria||'Не указаны')} · ${esc(answer.points||1)} балл.</div><div class="decision"><label><input type="radio" name="${esc(answer.question_id)}" value="1" required> Засчитать</label><label><input type="radio" name="${esc(answer.question_id)}" value="0" required> Не засчитать</label></div></section>`).join('')}<div class="field" style="margin-top:14px"><label>Комментарий ученику или для журнала</label><textarea class="input" name="comment" maxlength="1000"></textarea></div><div class="actions"><button class="button primary" type="submit">Завершить проверку</button></div></form>`}
    async function submitReview(event){event.preventDefault();const form=event.currentTarget,button=event.submitter,data=new FormData(form),decisions={};for(const [key,value] of data.entries())if(key!=='comment')decisions[key]=value==='1';setBusy(button,true);try{await api(`/api/training/editor/review/${encodeURIComponent(form.dataset.reviewForm)}`,{decisions,comment:data.get('comment')||''});await refreshBootstrap();await renderReviews()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    function showModal(html){$('modal').innerHTML=`<div class="modal-card">${html}</div>`;$('modal').classList.remove('hidden');document.querySelectorAll('[data-close]').forEach(button=>button.onclick=closeModal)}
    function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
    async function refreshBootstrap(){state=await api('/api/training/editor/bootstrap');$('role').textContent=state.role_label;$('reviewBadge').textContent=state.pending_reviews_count||0}
    async function load(){if(!PREVIEW&&!tg?.initData)throw new Error('Откройте конструктор кнопкой из Telegram-бота.');await refreshBootstrap();$('loading').classList.add('hidden');$('app').classList.remove('hidden');switchTab(activeTab)}
    function switchTab(tab){activeTab=tab;document.querySelectorAll('[data-tab]').forEach(button=>button.classList.toggle('active',button.dataset.tab===tab));if(tab==='lessons')renderLessons();if(tab==='tests')renderTests();if(tab==='reviews')renderReviews();window.scrollTo({top:0,behavior:'smooth'})}
    document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>switchTab(button.dataset.tab));
    (async()=>{try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#07101f');tg?.setBackgroundColor?.('#07101f');await load()}catch(error){$('loading').innerHTML=`<div class="error">${esc(error.message)}</div>`}})();
  </script>
</body>
</html>
