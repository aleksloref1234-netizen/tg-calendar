<html lang="ru">

  <style>
    :root{--bg:#07101f;--panel:#0d1a2c;--panel2:#11243b;--line:rgba(148,163,184,.18);--text:#f8fafc;--muted:#93a4bb;--blue:#38bdf8;--blue2:#2563eb;--green:#34d399;--yellow:#fbbf24;--red:#fb7185;--shadow:0 18px 42px rgba(0,0,0,.25)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 88% -12%,rgba(37,99,235,.22),transparent 34%),var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,textarea,select{font:inherit}.hidden{display:none!important}
    .shell{max-width:1040px;margin:0 auto;padding:18px 16px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--blue2),#0ea5e9);font-size:14px;font-weight:900;letter-spacing:.08em}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);font-weight:800}.brand h1{font-size:19px;margin:3px 0 0}.role{padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:rgba(17,36,59,.75);color:var(--muted);font-size:11px}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:rgba(13,26,44,.86);border:1px solid var(--line);border-radius:17px;margin-bottom:18px}.tabs button{border:0;border-radius:12px;padding:11px 8px;background:transparent;color:var(--muted);font-weight:800;font-size:12px}.tabs button.active{background:#183253;color:var(--text)}.badge{display:inline-flex;min-width:19px;height:19px;padding:0 6px;align-items:center;justify-content:center;border-radius:99px;background:rgba(56,189,248,.13);color:var(--blue);font-size:10px;margin-left:5px}
    .panel>.tabs{position:static;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;margin:0;backdrop-filter:none}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}.toolbar h2{font-size:20px;margin:0}.toolbar p{color:var(--muted);font-size:12px;margin:4px 0 0}.button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.button.primary{background:linear-gradient(135deg,var(--blue2),#0ea5e9);color:white}.button.secondary{background:#152b47;color:var(--text);border:1px solid var(--line)}.button.danger{background:rgba(251,113,133,.1);color:#fecdd3;border:1px solid rgba(251,113,133,.2)}.button.small{padding:8px 10px;font-size:11px}.button:disabled{opacity:.45;cursor:wait}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:linear-gradient(145deg,rgba(17,36,59,.95),rgba(11,24,41,.96));border:1px solid var(--line);border-radius:18px;padding:16px}.lesson-card{cursor:pointer}.lesson-card:hover{border-color:rgba(56,189,248,.35)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:15px;font-weight:850;line-height:1.35}.muted{color:var(--muted);font-size:12px;line-height:1.5}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tag{display:inline-flex;padding:6px 8px;border-radius:9px;background:rgba(56,189,248,.09);color:#bae6fd;font-size:10px;font-weight:800}.tag.ok{background:rgba(52,211,153,.09);color:#a7f3d0}.tag.warn{background:rgba(251,191,36,.09);color:#fde68a}
    .panel{background:rgba(13,26,44,.9);border:1px solid var(--line);border-radius:19px;padding:17px;margin-bottom:14px}.panel h3{font-size:16px;margin:0 0 14px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#cbd5e1;font-weight:750}.input{width:100%;border:1px solid var(--line);border-radius:12px;background:#0b1829;color:var(--text);padding:11px 12px;outline:none}.input:focus{border-color:rgba(56,189,248,.55)}textarea.input{min-height:100px;resize:vertical;line-height:1.5}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
    .list{display:grid;gap:9px}.list-item{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#10223a}.type{min-width:58px;text-align:center;padding:7px 6px;border-radius:9px;background:rgba(56,189,248,.1);color:var(--blue);font-size:9px;font-weight:900}.list-main{flex:1;min-width:0}.list-main b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis}.list-main small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.empty{text-align:center;color:var(--muted);padding:32px 14px;border:1px dashed var(--line);border-radius:16px}.back{border:0;background:transparent;color:var(--blue);padding:5px 0 12px;font-weight:800;cursor:pointer}
    .article-list{display:grid;gap:10px}.article-block{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:16px;padding:13px;background:linear-gradient(145deg,#10223a,#0b192b)}.article-order{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:rgba(56,189,248,.1);color:var(--blue);font-weight:900;font-size:12px}.article-main{min-width:0}.article-main b{display:block;font-size:13px}.article-main p{color:var(--muted);font-size:11px;line-height:1.5;margin:5px 0 0;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}.block-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.block-actions .button{padding:7px 9px}.builder-note{padding:12px 14px;border-radius:14px;border:1px solid rgba(56,189,248,.2);background:rgba(56,189,248,.06);color:#bae6fd;font-size:11px;line-height:1.55;margin-bottom:12px}.upload-note{font-size:10px;color:var(--muted);line-height:1.5}.upload-status{padding:10px;border-radius:11px;background:#0b1829;color:#bae6fd;font-size:11px}
    .case-questions{display:grid;gap:8px}.case-question{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#0b1829}.case-question-number{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:rgba(56,189,248,.1);color:var(--blue);font-size:10px;font-weight:900}.case-question-main{min-width:0}.case-question-main b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.case-question-main small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.case-question-actions{display:flex;gap:6px}.case-question-actions .button{padding:7px 8px}.case-question-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
    .modal{position:fixed;inset:0;background:rgba(2,8,18,.76);backdrop-filter:blur(10px);display:grid;place-items:center;padding:15px;z-index:30}.modal-card{width:min(680px,100%);max-height:92vh;overflow:auto;background:#0d1a2c;border:1px solid var(--line);border-radius:21px;padding:18px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.modal-head h3{margin:0}.close{border:0;background:#172b46;color:var(--text);border-radius:10px;width:34px;height:34px;cursor:pointer}
    .review{margin-bottom:12px}.answer{padding:12px;border-radius:13px;background:#0b1829;border:1px solid var(--line);margin-top:9px;white-space:pre-wrap;line-height:1.5;font-size:13px}.criteria{color:var(--muted);font-size:11px;margin-top:8px}.decision{display:flex;gap:8px;margin-top:10px}.decision label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:11px;padding:9px;font-size:11px;cursor:pointer}.decision input{accent-color:var(--blue)}
    .loader{min-height:65vh;display:grid;place-items:center;text-align:center;color:var(--muted)}.spinner{width:38px;height:38px;border:3px solid rgba(148,163,184,.18);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}.error{background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.22);border-radius:16px;padding:15px;color:#fecdd3}
    @media(max-width:700px){.shell{padding:12px 12px 60px}.role{display:none}.grid,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{align-items:flex-start}.toolbar .button{flex:0 0 auto}.list-item{display:grid;grid-template-columns:auto 1fr;align-items:start}.list-item .button{width:100%}.list-item .actions{margin:0;display:grid}.article-block{grid-template-columns:38px 1fr}.block-actions{grid-column:1/-1;justify-content:flex-start;padding-left:50px}.case-question{grid-template-columns:30px 1fr}.case-question-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.tabs{position:sticky;top:6px;z-index:15;backdrop-filter:blur(16px)}}
  </style>
</head>
<body>
  <main class="shell">
    <div id="loading" class="loader"><div><div class="spinner"></div><div>Загружаю конструктор курса…</div></div></div>
    <div id="app" class="hidden">
      <header class="top"><div class="brand"><div class="logo">УЦ</div><div><div class="eyebrow">Support Academy</div><h1>Конструктор курса</h1></div></div><div id="role" class="role"></div></header>
      <nav class="tabs"><button data-tab="lessons" class="active">Лекции</button><button data-tab="tests">Банк</button><button data-tab="reviews">Проверка <span id="reviewBadge" class="badge">0</span></button></nav>
      <section id="content"></section>
    </div>
  </main>
  <div id="modal" class="modal hidden"></div>
  <script>
    const BACKEND='https://tg-admin-bot-1k1g.onrender.com';
    const MAX_MEDIA_BYTES=500*1024*1024;
    const tg=window.Telegram?.WebApp;
    const PREVIEW=['127.0.0.1','localhost'].includes(location.hostname)&&new URLSearchParams(location.search).get('preview')==='1';
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const labels={published:'Опубликована',draft:'Черновик',archived:'Архив',auto:'По расписанию',open:'Открыта',closed:'Закрыта',single_choice:'С вариантами',easy:'Лёгкий',medium:'Средний',hard:'Сложный',entry:'Входной тест',lesson:'После лекции',final:'Финальный тест'};
    let state={lessons:[],banks:[],pending_reviews_count:0},activeTab='lessons',selectedLessonId='',selectedBankId='',bankDetail=null,bankFilter='all',detail=null,reviews=[],questionReturnCaseId='';
    const previewState={user:{telegram_id:'1001',role:'curator'},role_label:'Куратор',pending_reviews_count:1,media_storage_configured:true,media:[{media_id:'media-demo',media_type:'video',filename:'Пример ситуации.mp4',status:'ready'}],lessons:[{lesson_id:'lecture_1',order:'1',title:'Основы работы агента поддержки',topic:'Роль, регламент и базовый функционал',summary:'Каркас первой лекции.',unlock_mode:'auto',unlock_day:'2',publication_status:'published',global_access:'auto',pass_score:'80',blocks_count:3,materials_count:1,questions_count:2,open_questions_count:1},{lesson_id:'lecture_2',order:'2',title:'Выявление нарушений',topic:'Наблюдение и доказательства',summary:'',unlock_mode:'auto',unlock_day:'4',publication_status:'draft',global_access:'auto',pass_score:'80',blocks_count:0,materials_count:0,questions_count:0,open_questions_count:0}]};
    const previewDetail={lesson:previewState.lessons[0],media_storage_configured:true,media:previewState.media,blocks:[{block_id:'b1',order:'1',block_type:'heading',title:'Полномочия агента',active:'true',payload:{tone:'neutral'}},{block_id:'b2',order:'2',block_type:'custom',title:'Важный разбор',active:'true',payload:{custom_label:'Практика',content:'Куратор сам задаёт название, текст и оформление этого блока.',tone:'warning',items:['Зафиксировать ситуацию','Передать старшему']}},{block_id:'b3',order:'3',block_type:'video',title:'Видеоразбор',active:'true',payload:{media_id:'media-demo',caption:'Пример правильной фиксации',tone:'neutral'}}],materials:[{material_id:'m1',material_type:'document',title:'Старый материал.pdf',active:'true'}],questions:[{question_id:'q1',question_type:'single_choice',text:'Как следует поступить в ситуации?',option_a:'Вариант A',option_b:'Вариант B',option_c:'Вариант C',option_d:'Вариант D',correct_option:'B',explanation:'Пояснение',points:'1',active:'true'},{question_id:'q2',question_type:'open',text:'Опишите порядок эскалации спорной ситуации.',explanation:'Указаны фиксация, обращение к старшему и передача доказательств.',points:'2',active:'true'}]};
    previewState.banks=[{bank_id:'bank_entry',name:'Входной тест',bank_type:'entry',question_count:'10',case_count:'2',pass_score:'80',active:'true',pool_count:18,cases_count:4},{bank_id:'bank_lecture_1',name:'Тест: Основы работы агента поддержки',bank_type:'lesson',lesson_id:'lecture_1',question_count:'10',case_count:'0',pass_score:'80',active:'true',pool_count:14,cases_count:0},{bank_id:'bank_final',name:'Финальный тест',bank_type:'final',question_count:'10',case_count:'2',pass_score:'80',active:'true',pool_count:24,cases_count:5}];
    const previewBankDetail={bank:previewState.banks[0],media_storage_configured:true,media:previewState.media,cases:[{case_id:'case-demo',bank_id:'bank_entry',title:'Спорная блокировка игрока',description:'Полномасштабная ситуация для анализа действий администратора.',difficulty:'hard',media_id:'media-demo',active:'true'}],questions:[{question_id:'bank-q1',bank_id:'bank_entry',case_id:'case-demo',difficulty:'hard',question_type:'open',text:'Какие нарушения допущены в этой ситуации?',explanation:'Названы ошибки и верный порядок действий.',points:'2',active:'true'},{question_id:'bank-q2',bank_id:'bank_entry',case_id:'',difficulty:'medium',question_type:'single_choice',text:'Какое действие должно быть первым?',option_a:'Зафиксировать доказательства',option_b:'Игнорировать',option_c:'Выдать наказание без проверки',option_d:'Завершить смену',correct_option:'A',points:'1',active:'true'}]};
    async function previewApi(path,body){if(path.endsWith('/bootstrap'))return structuredClone(previewState);if(path.includes('/lesson/')&&!path.endsWith('/save'))return structuredClone(previewDetail);if(path.endsWith('/block/save')){const saved={...body,block_id:body.block_id||`preview-${Date.now()}`,order:body.order||String(previewDetail.blocks.length+1),active:'true'};const index=previewDetail.blocks.findIndex(item=>item.block_id===saved.block_id);if(index>=0)previewDetail.blocks[index]=saved;else previewDetail.blocks.push(saved);return structuredClone(saved)}if(path.endsWith('/block/reorder')){previewDetail.blocks.sort((a,b)=>body.block_ids.indexOf(a.block_id)-body.block_ids.indexOf(b.block_id));previewDetail.blocks.forEach((item,index)=>item.order=String(index+1));return structuredClone(previewDetail.blocks)}if(path.includes('/block/')&&path.endsWith('/toggle')){const id=decodeURIComponent(path.split('/').slice(-2)[0]),item=previewDetail.blocks.find(block=>block.block_id===id);if(item)item.active=String(body.active);return item||{}}if(path.endsWith('/reviews'))return [{attempt:{attempt_id:'a1',telegram_id:'2001',lesson_id:'lecture_1',completed_at:'2026-08-14T10:00:00Z'},user:{full_name:'Агент поддержки',telegram_id:'2001'},lesson:{title:'Основы работы агента поддержки'},items:[{question_id:'q2',text:'Опишите порядок эскалации спорной ситуации.',answer:'Зафиксирую доказательства и передам ситуацию старшему администратору.',criteria:'Указаны фиксация, обращение к старшему и передача доказательств.',points:2}]}];return body instanceof FormData?{}:(body||{})}
    const basePreviewApi=previewApi;previewApi=async function(path,body){if(path.includes('/question/')&&path.endsWith('/delete')){const id=decodeURIComponent(path.split('/').slice(-2)[0]),index=previewBankDetail.questions.findIndex(item=>item.question_id===id);if(index<0)throw new Error('Вопрос не найден.');return structuredClone(previewBankDetail.questions.splice(index,1)[0])}if(path.includes('/bank/')&&!path.endsWith('/save')){const value=structuredClone(previewBankDetail),bankId=decodeURIComponent(path.split('/').pop()),bank=previewState.banks.find(item=>item.bank_id===bankId)||previewState.banks[0];value.bank=structuredClone(bank);value.questions=value.questions.map(item=>({...item,bank_id:bank.bank_id}));value.cases=value.cases.map(item=>({...item,bank_id:bank.bank_id}));return value}return basePreviewApi(path,body)};
    async function api(path,body={}){
      if(PREVIEW)return previewApi(path,body);
      const isForm=body instanceof FormData;
      let response;
      try{
        response=await fetch(`${BACKEND}${path}`,{
          method:'POST',
          headers:{...(isForm?{}:{'Content-Type':'application/json'}),'X-Telegram-Init-Data':tg?.initData||''},
          body:isForm?body:JSON.stringify(body)
        });
      }catch(error){
        const requestError=new Error(error?.message||'Сервер временно недоступен.');
        requestError.retryable=true;
        throw requestError;
      }
      const result=await response.json().catch(()=>({status:'error',message:`HTTP ${response.status}`}));
      if(!response.ok||result.status!=='success'){
        const requestError=new Error(result.message||`Ошибка ${response.status}`);
        requestError.status=response.status;
        requestError.retryable=response.status===429||response.status>=500;
        throw requestError;
      }
      return result.data;
    }
    const wait=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));
    async function retryApi(path,body={},attempts=3){
      let lastError;
      for(let attempt=1;attempt<=attempts;attempt+=1){
        try{
          return await api(path,body);
        }catch(error){
          lastError=error;
          if(!error?.retryable||attempt===attempts)throw error;
          await wait(attempt*1200);
        }
      }
      throw lastError;
    }
    function setBusy(button,busy,text='Сохранение…'){if(!button)return;button.disabled=busy;if(busy){button.dataset.original=button.textContent;button.textContent=text}else button.textContent=button.dataset.original||button.textContent}
    function showError(message){$('content').innerHTML=`<div class="error">${esc(message)}</div>`}
    function lessonTags(item){return `<div class="meta"><span class="tag ${item.publication_status==='published'?'ok':'warn'}">${esc(labels[item.publication_status]||item.publication_status)}</span><span class="tag">Блоков: ${esc(item.blocks_count||0)}</span><span class="tag">Вопросов: ${esc(item.questions_count||0)}</span>${item.open_questions_count?`<span class="tag">Открытых: ${esc(item.open_questions_count)}</span>`:''}</div>`}

    async function validateVideoPlayback(file){
      const isVideo=(file.type||'').startsWith('video/')||/\.(mp4|mov|mkv|webm)$/i.test(file.name||'');
      if(!isVideo)return;
      if(!/\.mp4$/i.test(file.name||'')||(file.type&&file.type!=='video/mp4')){
        throw new Error('Для учебного центра загружайте видео в формате MP4 с кодеком H.264 и звуком AAC.');
      }
      const url=URL.createObjectURL(file),video=document.createElement('video');
      video.preload='auto';video.muted=true;video.playsInline=true;
      try{
        await new Promise((resolve,reject)=>{
          const timeout=setTimeout(resolve,12000),finish=callback=>{clearTimeout(timeout);callback()};
          video.addEventListener('loadeddata',()=>finish(resolve),{once:true});
          video.addEventListener('error',()=>finish(()=>reject(new Error('Telegram не сможет воспроизвести это видео. Перекодируйте его в MP4: H.264 + AAC.'))),{once:true});
          video.src=url;video.load();
        });
      }finally{
        video.removeAttribute('src');video.load();URL.revokeObjectURL(url);
      }
    }
    async function uploadMediaFile(file){
      if(file.size>MAX_MEDIA_BYTES){
        throw new Error('Размер одного видео или изображения не должен превышать 500 МБ.');
      }

      if(PREVIEW){
        return {
          media_id:'media-demo',
          media_type:file.type.startsWith('video/')?'video':'image',
          filename:file.name,
          status:'ready'
        };
      }

      await validateVideoPlayback(file);

      let prepared;
      try{
        prepared=await retryApi('/api/training/editor/media/upload-url',{
          filename:file.name,
          mime_type:file.type||'application/octet-stream',
          size:file.size
        });
      }catch(error){
        console.error('Ошибка получения URL для B2:',error);
        throw new Error(`Не удалось подготовить загрузку в Backblaze B2: ${error?.message||String(error)}`);
      }

      if(!prepared?.upload_url){
        console.error('Backend не вернул upload_url:',prepared);
        throw new Error('Backend не вернул адрес для загрузки файла в Backblaze B2.');
      }

      console.log('B2 upload URL:',prepared.upload_url);
      console.log('B2 upload headers:',prepared.headers);

      let response;
      try{
        response=await fetch(prepared.upload_url,{
          method:'PUT',
          headers:prepared.headers||{},
          body:file
        });
      }catch(error){
        console.error('Сетевая ошибка прямой загрузки в B2:',error);

        let endpoint='не удалось определить';
        let protocol='не удалось определить';
        let pageOrigin='не удалось определить';

        try{
          const uploadUrl=new URL(prepared.upload_url);
          endpoint=uploadUrl.host;
          protocol=uploadUrl.protocol;
        }catch(urlError){
          console.error('Не удалось разобрать upload_url:',urlError);
        }

        try{
          pageOrigin=window.location.origin||'null';
        }catch(originError){
          console.error('Не удалось определить origin Mini App:',originError);
        }

        throw new Error(
          `Не удалось отправить файл напрямую в Backblaze B2.\n`+
          `Ошибка браузера: ${error?.message||String(error)}\n`+
          `Endpoint: ${endpoint}\n`+
          `Protocol: ${protocol}\n`+
          `Origin Mini App: ${pageOrigin}`
        );
      }

      if(!response.ok){
        let responseText='';
        try{
          responseText=await response.text();
        }catch(error){
          console.error('Не удалось прочитать ответ B2:',error);
        }

        console.error(
          'Backblaze B2 отклонил PUT:',
          response.status,
          response.statusText,
          responseText
        );

        const details=responseText
          ? ` Ответ B2: ${responseText.slice(0,1000)}`
          : '';

        throw new Error(
          `Backblaze B2 отклонил загрузку: HTTP ${response.status} ${response.statusText||''}.${details}`
        );
      }

      try{
        return await retryApi(
          `/api/training/editor/media/${encodeURIComponent(prepared.media_id)}/complete`
        );
      }catch(error){
        console.error('Файл загружен в B2, но complete завершился ошибкой:',error);
        throw new Error(
          `Файл отправлен в Backblaze B2, но сервер не смог завершить регистрацию: ${error?.message||String(error)}`
        );
      }
    }

    function caseWord(count){const value=Math.abs(Number(count)||0)%100,last=value%10;return value>10&&value<20?'кейсов':last===1?'кейс':last>=2&&last<=4?'кейса':'кейсов'}
    function bankAttemptDescription(bank){const count=Number(bank.case_count||bank.question_count||0);return isCaseOnlyBank(bank)?`${count} ${caseWord(count)} в попытке · случайная выборка целых кейсов`:`${esc(bank.question_count||10)} вопросов в попытке · случайная выборка из активных`}
    function renderBank(){const bank=bankDetail.bank,cases=bankDetail.cases||[],questions=(bankDetail.questions||[]).filter(questionMatchesFilter);$('content').innerHTML=`<button class="back" id="backBanks">← К банкам</button><div class="toolbar"><div><h2>${esc(bank.name)}</h2><p>${esc(labels[bank.bank_type]||'Тест')} · ${bankAttemptDescription(bank)} · проходной балл ${esc(bank.pass_score||80)}%</p></div><div><button class="button secondary small" id="bankSettings">Настройки</button> <button class="button secondary small" id="addCase">Новый кейс</button> <button class="button secondary small" id="addClosed">Закрытый вопрос</button> <button class="button primary small" id="addOpen">Открытый вопрос</button></div></div><div class="panel"><div class="tabs">${[['all','Все'],['cases','Кейсы'],['video','С медиа'],['open','Открытые'],['closed','Закрытые']].map(([key,title])=>`<button type="button" data-bank-filter="${key}" class="${bankFilter===key?'active':''}">${title}</button>`).join('')}</div></div>${cases.length?`<div class="section-head"><h3>Кейсы</h3><span>${cases.length}</span></div><div class="panel"><div class="list">${cases.map(item=>`<div class="list-item"><span class="type">КЕЙС</span><div class="list-main"><b>${esc(item.title)}</b><small>${esc(labels[item.difficulty]||item.difficulty)} · вопросов: ${(bankDetail.questions||[]).filter(q=>q.case_id===item.case_id).length}${item.media_id?' · МЕДИА':''}</small></div><button class="button small secondary" data-edit-case="${esc(item.case_id)}">Изменить</button><button class="button small secondary" data-case-toggle="${esc(item.case_id)}" data-active="${String(item.active).toLowerCase()!=='false'}">${String(item.active).toLowerCase()==='false'?'Включить':'Отключить'}</button></div>`).join('')}</div></div>`:''}<div class="section-head"><h3>Вопросы</h3><span>${questions.length}</span></div><div class="panel"><div class="list">${questions.map((item,index)=>`<div class="list-item"><span class="type">${item.question_type==='open'?'ОТКРЫТЫЙ':'ВЫБОР'}</span><div class="list-main"><b>${index+1}. ${esc(item.text)}</b><small>${esc(labels[item.difficulty]||item.difficulty||'Средний')} · ${item.question_type==='open'?'проверяет куратор':`ответ: ${esc(item.correct_option)}`} · ${esc(item.points||1)} балл.${item.case_id?' · КЕЙС':''}${item.media_id?' · МЕДИА':''}</small></div><button class="button small secondary" data-edit-question="${esc(item.question_id)}">Изменить</button><button class="button small secondary" data-question-toggle="${esc(item.question_id)}" data-active="${String(item.active).toLowerCase()!=='false'}">${String(item.active).toLowerCase()==='false'?'Включить':'Отключить'}</button><button class="button small danger" data-delete-question="${esc(item.question_id)}">Удалить</button></div>`).join('')||'<div class="empty">По выбранному фильтру вопросов нет.</div>'}</div></div>`;$('backBanks').onclick=renderTests;$('bankSettings').onclick=showBankSettings;$('addCase').onclick=()=>showCaseModal({});$('addClosed').onclick=()=>showQuestionModal('single_choice');$('addOpen').onclick=()=>showQuestionModal('open');document.querySelectorAll('[data-bank-filter]').forEach(button=>button.onclick=()=>{bankFilter=button.dataset.bankFilter;renderBank()});document.querySelectorAll('[data-edit-case]').forEach(button=>button.onclick=()=>showCaseModal(cases.find(item=>item.case_id===button.dataset.editCase)));document.querySelectorAll('[data-case-toggle]').forEach(button=>button.onclick=()=>toggleCase(button));document.querySelectorAll('[data-edit-question]').forEach(button=>button.onclick=()=>showQuestionModal('',(bankDetail.questions||[]).find(item=>item.question_id===button.dataset.editQuestion)));document.querySelectorAll('[data-question-toggle]').forEach(button=>button.onclick=()=>toggleQuestion(button));document.querySelectorAll('[data-delete-question]').forEach(button=>button.onclick=()=>deleteQuestion(button))}
    function showBankSettings(){
      const item=bankDetail.bank;
      const amountFields=isCaseOnlyBank(item)?`<div class="field"><label>Количество кейсов в попытке</label><input class="input" type="number" min="1" max="100" name="case_count" value="${esc(item.case_count||item.question_count||1)}" required></div>`:`<div class="field"><label>Количество вопросов в попытке</label><input class="input" type="number" min="1" max="100" name="question_count" value="${esc(item.question_count||10)}" required></div><div class="field"><label>Минимум кейсов в попытке</label><input class="input" type="number" min="0" max="100" name="case_count" value="${esc(item.case_count||0)}" required></div>`;
      showModal(`<form id="bankForm"><div class="modal-head"><h3>Настройки банка</h3><button type="button" class="close" data-close>×</button></div><input type="hidden" name="bank_id" value="${esc(item.bank_id)}"><div class="form-grid"><div class="field full"><label>Название</label><input class="input" name="name" maxlength="200" value="${esc(item.name)}" required></div>${amountFields}<div class="field"><label>Проходной балл, %</label><input class="input" type="number" min="1" max="100" name="pass_score" value="${esc(item.pass_score||80)}" required></div><div class="field full"><div class="builder-note">${isCaseOnlyBank(item)?'Система случайно выбирает указанное число кейсов. Каждый кейс попадает в попытку целиком: описание, видео и все привязанные вопросы.':'Кейс выбирается целиком: его видео, описание и все привязанные вопросы попадают в одну попытку.'} Типы вопросов внутри кейса не ограничиваются.</div></div><div class="field"><label><input type="checkbox" name="active" ${String(item.active).toLowerCase()!=='false'?'checked':''}> Тест активен</label></div></div><div class="actions"><button type="button" class="button secondary" data-close>Отмена</button><button class="button primary" type="submit">Сохранить</button></div></form>`);
      $('bankForm').onsubmit=saveBank;
    }
    async function saveBank(event){event.preventDefault();const button=event.submitter,data=Object.fromEntries(new FormData(event.currentTarget));data.active=event.currentTarget.elements.active.checked;setBusy(button,true);try{await api('/api/training/editor/bank/save',data);closeModal();await refreshBootstrap();await openBank(selectedBankId)}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    function showCaseModal(item={}){questionReturnCaseId='';const mediaOptions=(bankDetail.media||state.media||[]).map(media=>`<option value="${esc(media.media_id)}" ${item.media_id===media.media_id?'selected':''}>${esc(media.media_type==='video'?'Видео':'Изображение')}: ${esc(media.filename)}</option>`).join(''),caseQuestions=(bankDetail.questions||[]).filter(question=>question.case_id===item.case_id),questionsSection=item.case_id?`<div class="field full"><label>Вопросы кейса</label><div class="case-questions">${caseQuestions.map((question,index)=>`<div class="case-question"><span class="case-question-number">${index+1}</span><span class="case-question-main"><b>${esc(question.text)}</b><small>${question.question_type==='open'?'Открытый вопрос':'Вопрос с вариантами'} · ${esc(question.points||1)} балл.</small></span><span class="case-question-actions"><button type="button" class="button small secondary" data-case-question-edit="${esc(question.question_id)}">Изменить</button><button type="button" class="button small danger" data-delete-question="${esc(question.question_id)}" data-return-case="${esc(item.case_id)}">Удалить</button></span></div>`).join('')||'<div class="empty">В кейсе пока нет вопросов.</div>'}</div><div class="case-question-toolbar"><button type="button" class="button small secondary" id="addCaseClosedQuestion">Добавить закрытый</button><button type="button" class="button small primary" id="addCaseOpenQuestion">Добавить открытый</button></div><div class="upload-note">Сохраните изменения полей кейса перед переходом к вопросам.</div></div>`:'<div class="field full"><div class="builder-note">После сохранения кейса откроется создание первого вопроса. Он будет автоматически привязан к этой ситуации.</div></div>';showModal(`<form id="caseForm"><div class="modal-head"><h3>${item.case_id?'Редактирование':'Новый'} кейс</h3><button type="button" class="close" data-close>×</button></div><input type="hidden" name="bank_id" value="${esc(selectedBankId)}"><input type="hidden" name="case_id" value="${esc(item.case_id||'')}"><div class="form-grid"><div class="field full"><label>Название ситуации</label><input class="input" name="title" maxlength="300" value="${esc(item.title||'')}" required></div><div class="field full"><label>Полное описание кейса</label><textarea class="input" name="description" maxlength="12000" required>${esc(item.description||'')}</textarea></div><div class="field"><label>Сложность</label><select class="input" name="difficulty">${['easy','medium','hard'].map(value=>`<option value="${value}" ${(item.difficulty||'medium')===value?'selected':''}>${labels[value]}</option>`).join('')}</select></div><div class="field full"><label>Фото или видео кейса</label><select class="input" name="media_id"><option value="">Без медиа</option>${mediaOptions}</select><label>или загрузить новое напрямую в Backblaze</label><input class="input" type="file" name="media_file" accept="image/*,video/*" ${bankDetail.media_storage_configured?'':'disabled'}><div class="upload-note">До 500 МБ. Файл отправляется напрямую в приватное хранилище.</div></div>${questionsSection}</div><div class="actions"><button type="button" class="button secondary" data-close>Отмена</button><button class="button primary" type="submit">Сохранить кейс</button></div></form>`);$('caseForm').onsubmit=saveCase;if(item.case_id){$('addCaseClosedQuestion').onclick=()=>showQuestionModal('single_choice',{case_id:item.case_id,difficulty:item.difficulty||'medium'},item.case_id);$('addCaseOpenQuestion').onclick=()=>showQuestionModal('open',{case_id:item.case_id,difficulty:item.difficulty||'medium'},item.case_id);document.querySelectorAll('[data-case-question-edit]').forEach(button=>button.onclick=()=>showQuestionModal('',caseQuestions.find(question=>question.question_id===button.dataset.caseQuestionEdit),item.case_id));document.querySelectorAll('[data-return-case]').forEach(button=>button.onclick=()=>deleteQuestion(button))}}
    async function saveCase(event){event.preventDefault();const button=event.submitter,data=new FormData(event.currentTarget),file=data.get('media_file'),isNew=!data.get('case_id');setBusy(button,true,file?.size?'Загрузка в хранилище…':'Сохранение…');try{if(file?.size){const media=await uploadMediaFile(file);data.set('media_id',media.media_id)}data.delete('media_file');const saved=await api('/api/training/editor/case/save',Object.fromEntries(data));closeModal();await openBank(selectedBankId);if(isNew&&saved?.case_id)showQuestionModal('open',{case_id:saved.case_id,difficulty:saved.difficulty||'medium'},saved.case_id)}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function toggleCase(button){setBusy(button,true);try{await api(`/api/training/editor/case/${encodeURIComponent(button.dataset.caseToggle)}/toggle`,{active:button.dataset.active!=='true'});await openBank(selectedBankId)}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    function reopenCaseModal(caseId){const item=(bankDetail?.cases||[]).find(value=>value.case_id===caseId);if(item)showCaseModal(item);else closeModal()}
    function showQuestionModal(type,item={},returnCaseId=''){questionReturnCaseId=returnCaseId;type=type||item.question_type||'single_choice';const open=type==='open',mediaInfo=item.media_id?`<div class="muted">К вопросу уже прикреплено медиа.</div><label><input type="checkbox" name="remove_media" value="true"> Удалить текущее медиа</label>`:'<div class="muted">Можно оставить вопрос без медиа.</div>',mediaOptions=(bankDetail?.media||state.media||[]).map(media=>`<option value="${esc(media.media_id)}" ${item.media_id===media.media_id?'selected':''}>${esc(media.media_type==='video'?'Видео':'Изображение')}: ${esc(media.filename)}</option>`).join(''),caseOptions=(bankDetail?.cases||[]).filter(value=>String(value.active).toLowerCase()!=='false'||value.case_id===item.case_id).map(value=>`<option value="${esc(value.case_id)}" ${item.case_id===value.case_id?'selected':''}>${esc(value.title)}</option>`).join('');showModal(`<form id="questionForm"><div class="modal-head"><h3>${item.question_id?'Редактирование':'Новый'} ${open?'открытый вопрос':'вопрос с вариантами'}</h3><button type="button" class="close" data-close>×</button></div><input type="hidden" name="bank_id" value="${esc(selectedBankId)}"><input type="hidden" name="question_id" value="${esc(item.question_id||'')}"><input type="hidden" name="question_type" value="${esc(type)}"><div class="form-grid"><div class="field full"><label>Текст вопроса</label><textarea class="input" name="text" maxlength="2000" required>${esc(item.text||'')}</textarea></div><div class="field"><label>Сложность</label><select class="input" name="difficulty">${['easy','medium','hard'].map(value=>`<option value="${value}" ${(item.difficulty||'medium')===value?'selected':''}>${labels[value]}</option>`).join('')}</select></div><div class="field"><label>Кейс</label><select class="input" name="case_id"><option value="">Самостоятельный вопрос</option>${caseOptions}</select></div><div class="field full"><label>Защищённое фото или видео</label><select class="input" name="media_id"><option value="">Без медиа</option>${mediaOptions}</select><label>или загрузить новое напрямую в Backblaze</label><input class="input" type="file" name="media_file" accept="image/*,video/*" ${bankDetail?.media_storage_configured?'':'disabled'}><div class="upload-note">До 500 МБ. Файл отправляется напрямую в приватное хранилище Backblaze B2.</div>${mediaInfo}</div>${open?`<div class="field full"><label>Критерии проверки для куратора</label><textarea class="input" name="explanation" maxlength="3000" placeholder="Что должен содержать правильный ответ">${esc(item.explanation||'')}</textarea></div>`:`${['a','b','c','d'].map(letter=>`<div class="field"><label>Вариант ${letter.toUpperCase()}</label><input class="input" name="option_${letter}" value="${esc(item[`option_${letter}`]||'')}" required></div>`).join('')}<div class="field"><label>Правильный вариант</label><select class="input" name="correct_option">${'ABCD'.split('').map(letter=>`<option value="${letter}" ${item.correct_option===letter?'selected':''}>${letter}</option>`).join('')}</select></div><div class="field full"><label>Пояснение после ошибки</label><textarea class="input" name="explanation" maxlength="3000">${esc(item.explanation||'')}</textarea></div>`}<div class="field"><label>Баллы</label><input class="input" type="number" min="1" max="100" name="points" value="${esc(item.points||1)}"></div></div><div class="actions"><button type="button" class="button secondary" data-close>Отмена</button><button class="button primary" type="submit">Сохранить вопрос</button></div></form>`);$('questionForm').onsubmit=saveQuestion;if(returnCaseId)document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>reopenCaseModal(returnCaseId))}
    async function saveQuestion(event){event.preventDefault();const button=event.submitter,data=new FormData(event.currentTarget),file=data.get('media_file'),returnCaseId=questionReturnCaseId;if(data.get('remove_media'))data.set('media_id','');setBusy(button,true,file?.size?'Загрузка в хранилище…':'Сохранение…');try{if(file?.size){const media=await uploadMediaFile(file);data.set('media_id',media.media_id)}data.delete('media_file');await api('/api/training/editor/question/save',data);closeModal();await openBank(selectedBankId);await refreshBootstrap();if(returnCaseId)reopenCaseModal(returnCaseId)}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function toggleQuestion(button){setBusy(button,true);try{await api(`/api/training/editor/question/${encodeURIComponent(button.dataset.questionToggle)}/toggle`,{active:button.dataset.active!=='true'});await openBank(selectedBankId)}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function deleteQuestion(button){const id=button.dataset.deleteQuestion,returnCaseId=button.dataset.returnCase||'',item=(bankDetail.questions||[]).find(question=>question.question_id===id),name=(item?.text||'этот вопрос').trim(),shortName=name.length>90?`${name.slice(0,87)}…`:name;if(!confirm(`Удалить вопрос «${shortName}»?\n\nОн исчезнет из банка и больше не будет попадать в новые тесты. Действие нельзя отменить.`))return;setBusy(button,true,'Удаление…');try{await api(`/api/training/editor/question/${encodeURIComponent(id)}/delete`);await openBank(selectedBankId);await refreshBootstrap();if(returnCaseId)reopenCaseModal(returnCaseId)}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function renderReviews(){selectedLessonId='';$('content').innerHTML='<div class="loader"><div><div class="spinner"></div>Загружаю ответы…</div></div>';try{reviews=await api('/api/training/editor/reviews');$('content').innerHTML=`<div class="toolbar"><div><h2>Проверка открытых ответов</h2><p>Оцените каждый ответ и завершите попытку.</p></div></div>${reviews.map(renderReviewCard).join('')||'<div class="empty">Ответов, ожидающих проверки, нет.</div>'}`;document.querySelectorAll('[data-review-form]').forEach(form=>form.onsubmit=submitReview)}catch(error){showError(error.message)}}
    function renderReviewCard(item){const attempt=item.attempt,user=item.user||{},lesson=item.lesson||{};return `<form class="panel review" data-review-form="${esc(attempt.attempt_id)}"><div class="row"><div><div class="title">${esc(user.full_name||user.username||user.telegram_id)}</div><div class="muted">${esc(lesson.title||attempt.lesson_id)}</div></div><span class="tag warn">На проверке</span></div>${item.items.map((answer,index)=>`<section><h3>${index+1}. ${esc(answer.text)}</h3><div class="answer">${esc(answer.answer)}</div><div class="criteria"><b>Критерии:</b> ${esc(answer.criteria||'Не указаны')} · ${esc(answer.points||1)} балл.</div><div class="decision"><label><input type="radio" name="${esc(answer.question_id)}" value="1" required> Засчитать</label><label><input type="radio" name="${esc(answer.question_id)}" value="0" required> Не засчитать</label></div></section>`).join('')}<div class="field" style="margin-top:14px"><label>Комментарий ученику или для журнала</label><textarea class="input" name="comment" maxlength="1000"></textarea></div><div class="actions"><button class="button primary" type="submit">Завершить проверку</button></div></form>`}
    async function submitReview(event){event.preventDefault();const form=event.currentTarget,button=event.submitter,data=new FormData(form),decisions={};for(const [key,value] of data.entries())if(key!=='comment')decisions[key]=value==='1';setBusy(button,true);try{await api(`/api/training/editor/review/${encodeURIComponent(form.dataset.reviewForm)}`,{decisions,comment:data.get('comment')||''});await refreshBootstrap();await renderReviews()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    function showModal(html){$('modal').innerHTML=`<div class="modal-card">${html}</div>`;$('modal').classList.remove('hidden');document.querySelectorAll('[data-close]').forEach(button=>button.onclick=closeModal)}
    function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
    async function refreshBootstrap(){state=await api('/api/training/editor/bootstrap');$('role').textContent=state.role_label;$('reviewBadge').textContent=state.pending_reviews_count||0}
    async function load(){if(!PREVIEW&&!tg?.initData)throw new Error('Откройте конструктор кнопкой из Telegram-бота.');await refreshBootstrap();$('loading').classList.add('hidden');$('app').classList.remove('hidden');switchTab(activeTab)}
    function switchTab(tab){activeTab=tab;document.querySelectorAll('[data-tab]').forEach(button=>button.classList.toggle('active',button.dataset.tab===tab));if(tab==='lessons')renderLessons();if(tab==='tests')renderTests();if(tab==='reviews')renderReviews();window.scrollTo({top:0,behavior:'smooth'})}
    document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>switchTab(button.dataset.tab));
    (async()=>{try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#07101f');tg?.setBackgroundColor?.('#07101f');await load()}catch(error){$('loading').innerHTML=`<div class="error">${esc(error.message)}</div>`}})();
  </script>
