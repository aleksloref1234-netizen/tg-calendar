<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Заявление на неактив</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="webapp-watermark.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/ru.js"></script>

  <style>
    :root {
      --bg-color: #121417;
      --card-bg: #1b1e23;
      --border-color: #2e343d;
      --text-main: #e1e4e8;
      --text-muted: #8b949e;
      --accent-color: #3182ce;
      --accent-alpha: rgba(49, 130, 206, 0.25);
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      box-sizing: border-box;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 0 0 4px 0;
      color: #ffffff;
    }

    .header p {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0;
    }

    /* Быстрые пресеты */
    .presets {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .preset-btn {
      flex: 1;
      background: #141619;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 0;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-btn:active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    /* Календарь */
    .flatpickr-calendar {
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
      margin: 0 auto;
      width: 100% !important;
    }

    .flatpickr-months {
      background: #141619 !important;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 10px;
      padding: 2px 0;
    }

    .flatpickr-months .flatpickr-month {
      color: #ffffff !important;
      fill: #ffffff !important;
      height: 36px !important;
    }

    .flatpickr-current-month {
      padding-top: 6px !important;
      font-size: 14px !important;
    }

    .flatpickr-weekdays {
      background: transparent !important;
      padding: 0 4px !important;
    }

    .flatpickr-weekdaycontainer {
      max-width: 100% !important;
      justify-content: space-around;
    }

    .flatpickr-weekday {
      background: transparent !important;
      color: var(--text-muted) !important;
      font-weight: 600 !important;
      font-size: 12px !important;
      text-transform: uppercase;
    }

    .flatpickr-days {
      width: 100% !important;
    }

    .dayContainer {
      width: 100% !important;
      min-width: 100% !important;
      max-width: 100% !important;
      justify-content: space-around;
    }

    .flatpickr-day {
      color: var(--text-main) !important;
      border-radius: 6px !important;
      height: 36px !important;
      line-height: 36px !important;
    }

    /* ПОЛНОСТЬЮ СКРЫВАЕМ ДНИ ДРУГИХ МЕСЯЦЕВ */
    .flatpickr-day.prevMonthDay, 
    .flatpickr-day.nextMonthDay {
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .flatpickr-day.selected, 
    .flatpickr-day.startRange, 
    .flatpickr-day.endRange {
      background: var(--accent-color) !important;
      border-color: var(--accent-color) !important;
      color: #ffffff !important;
      font-weight: 700;
    }

    .flatpickr-day.inRange {
      background: var(--accent-alpha) !important;
      box-shadow: -5px 0 0 var(--accent-alpha), 5px 0 0 var(--accent-alpha) !important;
    }

    .flatpickr-day.flatpickr-disabled {
      color: #2e343d !important;
      opacity: 0.3;
    }

    /* Сводка выбора */
    .summary-box {
      margin-top: 14px;
      padding: 10px 12px;
      background: #141619;
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .summary-row:last-child {
      margin-bottom: 0;
    }

    .summary-label {
      color: var(--text-muted);
    }

    .summary-value {
      color: #ffffff;
      font-weight: 600;
    }

    .days-count {
      color: var(--accent-color);
      font-weight: 700;
    }
    body{background-color:#0f172a;background-image:linear-gradient(rgba(119,140,163,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(119,140,163,.055) 1px,transparent 1px),radial-gradient(900px 420px at 100% -120px,rgba(56,189,248,.12),transparent 65%);background-size:28px 28px,28px 28px,auto}
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Период неактива</h1>
      <p>Выберите даты в календаре или используйте быстрый выбор</p>
    </div>

    <!-- Кнопки быстрого выбора -->
    <div class="presets">
      <button class="preset-btn" onclick="selectToday()">Сегодня</button>
      <button class="preset-btn" onclick="selectDays(3)">На 3 дня</button>
      <button class="preset-btn" onclick="selectDays(7)">На неделю</button>
    </div>
    
    <!-- Контейнер календаря -->
    <div id="calendar-container"></div>

    <!-- Сводка с рассчётом дней -->
    <div id="summary" class="summary-box">
      <div class="summary-row">
        <span class="summary-label">Период:</span>
        <span id="dates-val" class="summary-value">-</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Длительность:</span>
        <span id="days-val" class="summary-value days-count">-</span>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ⚠️ ВСТАВЬТЕ СЮДА ТОКЕН ВАШЕГО БОТА ТЕЛЕГРАМ
    const BOT_TOKEN = "8714880754:AAFDr056m9EF-vTZOJGICtLpITYC9CsFBkc"; 

    let selectedStartData = "";
    let selectedEndData = "";

    // Настройка MainButton при старте
    tg.MainButton.setParams({
      text: "ПОДТВЕРДИТЬ ВЫБОР",
      color: "#3182ce",
      text_color: "#ffffff",
      is_visible: false
    });

    // Вычисляем минимальную дату: текущий день минус 2 дня
    const minAllowedDate = new Date();
    minAllowedDate.setDate(minAllowedDate.getDate() - 2);

    const picker = flatpickr("#calendar-container", {
      inline: true,
      mode: "range",
      locale: "ru",
      dateFormat: "d.m.Y",
      minDate: minAllowedDate, // Установлено разрешением на 2 дня назад
      onChange: function(selectedDates, dateStr, instance) {
        if (tg.HapticFeedback) {
          tg.HapticFeedback.impactOccurred('light');
        }
        updateSummary(selectedDates, instance);
      }
    });

    function updateSummary(selectedDates, instance) {
      const summaryBox = document.getElementById("summary");
      const datesVal = document.getElementById("dates-val");
      const daysVal = document.getElementById("days-val");

      if (selectedDates.length > 0) {
        const start = selectedDates[0];
        const end = selectedDates[1] || start;

        selectedStartData = instance.formatDate(start, "d.m.Y");
        selectedEndData = instance.formatDate(end, "d.m.Y");

        const diffTime = Math.abs(end - start);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

        datesVal.innerText = selectedStartData === selectedEndData ? selectedStartData : `с ${selectedStartData} по ${selectedEndData}`;
        daysVal.innerText = `${diffDays} дн.`;
        
        summaryBox.style.display = "block";
        tg.MainButton.show();
        tg.MainButton.enable();
      } else {
        summaryBox.style.display = "none";
        tg.MainButton.hide();
      }
    }

    function selectToday() {
      const today = new Date();
      picker.setDate([today, today], true);
    }

    function selectDays(days) {
      const start = new Date();
      const end = new Date();
      end.setDate(start.getDate() + (days - 1));
      picker.setDate([start, end], true);
    }

    // Обработчик нажатия на главную кнопку Telegram
    tg.onEvent('mainButtonClicked', async function() {
      if (!selectedStartData) return;

      if (tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }

      tg.MainButton.showProgress();

      const queryId = tg.initDataUnsafe?.query_id;

      if (queryId) {
        try {
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/answerWebAppQuery`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              web_app_query_id: queryId,
              result: {
                type: "article",
                id: "dates_selected",
                title: "Даты неактива выбраны",
                input_message_content: {
                  message_text: `ВЫБРАННЫЕ_ДАТЫ:${selectedStartData}_${selectedEndData}`
                }
              }
            })
          });
        } catch (error) {
          console.error("Ошибка при отправке из Inline WebApp:", error);
        } finally {
          tg.MainButton.hideProgress();
          tg.close();
        }
      } else {
        const payload = JSON.stringify({
          start_date: selectedStartData,
          end_date: selectedEndData
        });
        tg.sendData(payload);
        tg.MainButton.hideProgress();
        tg.close();
      }
    });
  </script>
</body>
</html>
