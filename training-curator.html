    async function revokeAccess(button){if(!confirm(`Отозвать доступ у ${button.dataset.revoke}?`))return;setBusy(button,true);try{await api('/api/training/curator/access/revoke',{telegram_id:button.dataset.revoke});await reload();renderAccess()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function assignCurator(event){event.preventDefault();const button=event.submitter,data=Object.fromEntries(new FormData(event.currentTarget));setBusy(button,true);try{await api('/api/training/curator/access/assign',data);closeModal();await reload();renderAccess()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function syncAccess(){const button=$('syncAccess');setBusy(button,true,'Синхронизация…');try{const result=await api('/api/training/curator/access/sync');await reload();renderAccess();tg?.showAlert?.(`Синхронизация завершена. В таблице: ${result.total}. Добавлено: ${result.added}. Снято: ${result.revoked||0}.`)}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    function renderSettings(){const settingRows=Object.entries(state.settings||{}).map(([key,value])=>{const label=settingLabels[key]||[key,''];return `<form class="settings-row" data-setting="${esc(key)}"><div><b>${esc(label[0])}</b><small>${esc(label[1])}</small></div><input class="input" type="number" name="value" value="${esc(value)}" required><button class="button secondary small" type="submit">Сохранить</button></form>`}).join(''),system=state.system?`<div class="panel"><h3>Состояние системы</h3><div class="grid"><div><span class="tag ${state.system.maintenance_mode?'warn':''}">${state.system.maintenance_mode?'Технические работы включены':'Система доступна'}</span><p class="main"><small>Доступов: ${state.system.users_count} · лекций: ${state.system.lessons_count}</small></p></div><div class="actions"><button class="button secondary" id="toggleMaintenance">${state.system.maintenance_mode?'Выключить техработы':'Включить техработы'}</button><button class="button secondary" id="refreshSystem">Обновить данные</button></div></div></div>`:'',audit=(state.audit||[]).length?`<div class="panel"><h3>Последние действия</h3>${state.audit.map(item=>`<div class="audit">${esc(item.action)} · ${esc(item.target_id)}<small>${esc(item.created_at)} · исполнитель ${esc(item.actor_id)}</small></div>`).join('')}</div>`:'';$('content').innerHTML=`<div class="toolbar"><div><h2>Настройки</h2><p>Параметры курса и техническое управление.</p></div>${state.permissions.content?'<button class="button secondary" id="openEditor">Конструктор курса →</button>':''}</div>${settingRows?`<div class="panel"><h3>Расписание и баллы</h3>${settingRows}</div>`:'<div class="empty">Для вашей роли доступны только личные доступы и статистика.</div>'}${system}${audit}`;document.querySelectorAll('[data-setting]').forEach(form=>form.onsubmit=saveSetting);if($('openEditor'))$('openEditor').onclick=openEditor;if($('toggleMaintenance'))$('toggleMaintenance').onclick=()=>systemAction('maintenance_toggle',$('toggleMaintenance'));if($('refreshSystem'))$('refreshSystem').onclick=()=>systemAction('refresh',$('refreshSystem'))}
    async function saveSetting(event){event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('/api/training/curator/settings/save',{key:event.currentTarget.dataset.setting,value:new FormData(event.currentTarget).get('value')});await reload();renderSettings()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function systemAction(action,button){setBusy(button,true);try{await api('/api/training/curator/system/action',{action});await reload();renderSettings()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    function openEditor(){const url=new URL('training-editor.html',location.href);url.search=location.search;url.hash=location.hash;location.href=url.href}
    function showModal(html){$('modal').innerHTML=`<div class="modal-card">${html}</div>`;$('modal').classList.remove('hidden');document.querySelectorAll('[data-close]').forEach(button=>button.onclick=closeModal)}function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
    async function reload(){state=await api('/api/training/curator/bootstrap');window.AdminControlWatermark?.render(state.user||{});$('role').textContent=state.role_label;$('reviewBadge').textContent=state.pending_reviews_count||0}
    function switchTab(tab){activeTab=tab;document.querySelectorAll('[data-tab]').forEach(button=>button.classList.toggle('active',button.dataset.tab===tab));if(tab==='overview')renderOverview();if(tab==='reviews')renderReviews();if(tab==='access')renderAccess();if(tab==='settings')renderSettings();window.scrollTo({top:0,behavior:'smooth'})}
    async function load(){telegramInitData=await waitForTelegramInitData();if(!PREVIEW&&!telegramInitData)throw new Error('Откройте кабинет куратора кнопкой из Telegram-бота.');await reload();document.querySelector('[data-tab="reviews"]').classList.toggle('hidden',!state.permissions.reviews);document.querySelector('[data-tab="access"]').classList.toggle('hidden',!state.permissions.access);document.querySelector('[data-tab="settings"]').classList.toggle('hidden',!(state.permissions.settings||state.permissions.system||state.permissions.audit||state.permissions.content));const visibleTabs=[...document.querySelectorAll('[data-tab]:not(.hidden)')];$('tabs').style.gridTemplateColumns=`repeat(${visibleTabs.length},1fr)`;$('loading').classList.add('hidden');$('app').classList.remove('hidden');switchTab(activeTab)}
    document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>switchTab(button.dataset.tab));
    (async()=>{try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#07101f');tg?.setBackgroundColor?.('#07101f');await load()}catch(error){$('loading').innerHTML=`<div class="error">${esc(error.message)}</div>`}})();
  </script>
</body>
