<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Кабинет куратора</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#07101f;--panel:#0d1a2c;--panel2:#11243b;--line:rgba(148,163,184,.18);--text:#f8fafc;--muted:#93a4bb;--blue:#38bdf8;--blue2:#2563eb;--green:#34d399;--yellow:#fbbf24;--red:#fb7185;--shadow:0 18px 42px rgba(0,0,0,.25)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 88% -12%,rgba(37,99,235,.22),transparent 34%),var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
    .shell{max-width:1040px;margin:0 auto;padding:18px 16px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--blue2),#0ea5e9);font-size:13px;font-weight:900}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);font-weight:800}.brand h1{font-size:19px;margin:3px 0 0}.role{padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:rgba(17,36,59,.75);color:var(--muted);font-size:11px}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;background:rgba(13,26,44,.86);border:1px solid var(--line);border-radius:17px;margin-bottom:18px}.tabs button{border:0;border-radius:12px;padding:11px 8px;background:transparent;color:var(--muted);font-weight:800;font-size:12px}.tabs button.active{background:#183253;color:var(--text)}.badge{display:inline-flex;min-width:19px;height:19px;padding:0 6px;align-items:center;justify-content:center;border-radius:99px;background:rgba(56,189,248,.13);color:var(--blue);font-size:10px;margin-left:4px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}.toolbar h2{font-size:20px;margin:0}.toolbar p{color:var(--muted);font-size:12px;margin:4px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.button.primary{background:linear-gradient(135deg,var(--blue2),#0ea5e9);color:#fff}.button.secondary{background:#152b47;color:var(--text);border:1px solid var(--line)}.button.danger{background:rgba(251,113,133,.1);color:#fecdd3;border:1px solid rgba(251,113,133,.2)}.button.small{padding:8px 10px;font-size:11px}.button:disabled{opacity:.45;cursor:wait}
    .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.metric,.panel{background:rgba(13,26,44,.9);border:1px solid var(--line);border-radius:18px;padding:16px}.metric b{display:block;font-size:24px}.metric span{display:block;color:var(--muted);font-size:10px;margin-top:5px}.panel{margin-bottom:14px}.panel h3{font-size:16px;margin:0 0 14px}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#10223a}.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(56,189,248,.1);color:var(--blue);font-weight:900;font-size:12px}.main{min-width:0;flex:1}.main b{display:block;font-size:13px}.main small{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.4}.score{font-weight:900;color:var(--blue)}.tag{display:inline-flex;padding:6px 8px;border-radius:9px;background:rgba(56,189,248,.09);color:#bae6fd;font-size:10px;font-weight:800}.tag.warn{background:rgba(251,191,36,.09);color:#fde68a}
    .search{width:100%;border:1px solid var(--line);border-radius:12px;background:#0b1829;color:var(--text);padding:11px 12px;outline:none;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:11px;color:#cbd5e1;font-weight:750}.input{width:100%;border:1px solid var(--line);border-radius:12px;background:#0b1829;color:var(--text);padding:11px 12px;outline:none}.settings-row{display:grid;grid-template-columns:1fr 130px auto;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border-bottom:0}.settings-row b{font-size:12px}.settings-row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.audit{padding:10px 0;border-bottom:1px solid var(--line);font-size:11px;color:#dbeafe}.audit:last-child{border-bottom:0}.audit small{display:block;color:var(--muted);margin-top:4px}.empty{text-align:center;color:var(--muted);padding:32px 14px;border:1px dashed var(--line);border-radius:16px}
    .modal{position:fixed;inset:0;background:rgba(2,8,18,.76);backdrop-filter:blur(10px);display:grid;place-items:center;padding:15px;z-index:30}.modal-card{width:min(620px,100%);max-height:92vh;overflow:auto;background:#0d1a2c;border:1px solid var(--line);border-radius:21px;padding:18px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.modal-head h3{margin:0}.close{border:0;background:#172b46;color:var(--text);border-radius:10px;width:34px;height:34px;cursor:pointer}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
    .review-case{margin-top:15px;padding:15px;border:1px solid rgba(56,189,248,.24);border-radius:16px;background:rgba(56,189,248,.05)}.review-case-label{color:var(--blue);font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.review-case h3{margin:7px 0 5px}.review-case>p{margin:0;color:#cbd5e1;font-size:12px;line-height:1.55;white-space:pre-wrap}.review-question{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.review-media{position:relative;min-height:120px;margin-top:12px;border:1px solid var(--line);border-radius:14px;background:#020712;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:11px}.review-media img,.review-media video{display:block;width:100%;max-height:520px;object-fit:contain;background:#020712}.review-watermark{position:absolute;z-index:2;right:8%;top:10%;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.48);color:rgba(255,255,255,.62);font-size:9px;font-weight:800;pointer-events:none}.answer{padding:12px;border-radius:13px;background:#0b1829;border:1px solid var(--line);margin-top:9px;white-space:pre-wrap;line-height:1.5;font-size:13px}.criteria{color:var(--muted);font-size:11px;margin-top:8px}.decision{display:flex;gap:8px;margin-top:10px}.decision label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:11px;padding:9px;font-size:11px;cursor:pointer}.decision input{accent-color:var(--blue)}textarea.input{min-height:100px;resize:vertical;line-height:1.5}
    .loader{min-height:65vh;display:grid;place-items:center;text-align:center;color:var(--muted)}.spinner{width:38px;height:38px;border:3px solid rgba(148,163,184,.18);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}.error{background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.22);border-radius:16px;padding:15px;color:#fecdd3}
    @media(max-width:700px){.shell{padding:12px 12px 60px}.role{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:flex-start;flex-direction:column}.item{align-items:flex-start}.settings-row{grid-template-columns:1fr}.tabs{position:sticky;top:6px;z-index:15;backdrop-filter:blur(16px)}}
  </style>
</head>
<body>
  <main class="shell">
    <div id="loading" class="loader"><div><div class="spinner"></div><div>Загружаю кабинет куратора…</div></div></div>
    <div id="app" class="hidden">
      <header class="top"><div class="brand"><div class="logo">КК</div><div><div class="eyebrow">Support Academy</div><h1>Кабинет куратора</h1></div></div><div id="role" class="role"></div></header>
      <nav id="tabs" class="tabs"><button data-tab="overview" class="active">Обзор</button><button data-tab="reviews">Проверка <span id="reviewBadge" class="badge">0</span></button><button data-tab="access">Доступы</button><button data-tab="settings">Настройки</button></nav>
      <section id="content"></section>
    </div>
  </main>
  <div id="modal" class="modal hidden"></div>
  <script>
    const BACKEND='https://tg-admin-bot-1k1g.onrender.com',tg=window.Telegram?.WebApp,PREVIEW=['127.0.0.1','localhost'].includes(location.hostname)&&new URLSearchParams(location.search).get('preview')==='1';
    const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const roleLabels={helper:'Агент поддержки',curator:'Куратор',deputy:'Заместитель куратора',head:'Руководство',owner:'Руководитель центра'},settingLabels={default_pass_score:['Проходной балл','Процент для успешного прохождения теста'],notification_hour:['Час отправки лекций','Местный час от 0 до 23'],reminder_after_hours:['Напоминание','Через сколько часов напомнить о лекции'],max_self_retries:['Самостоятельные пересдачи','Допустимое число повторных попыток']};
    let state=null,activeTab='overview';
    const previewState={user:{telegram_id:'9001',role:'owner',display_name:'Руководитель центра'},role_label:'Руководитель центра',permissions:{stats:true,reviews:true,access:true,access_sync:true,settings:true,audit:true,system:true,content:true},pending_reviews_count:1,manageable_roles:['helper','curator','deputy','head'],overview:{total:3,counts:{passed:1,in_progress:1,attention:1,not_started:0},students:[{user:{telegram_id:'5155186274',display_name:'Helper_Nick'},passed:1,total:4,retry_required:0,progress_percent:25},{user:{telegram_id:'6004546339',display_name:'Second_Helper'},passed:4,total:4,retry_required:0,progress_percent:100},{user:{telegram_id:'1531957988',display_name:'Third_Helper'},passed:1,total:4,retry_required:1,progress_percent:25}]},users:[{telegram_id:'5155186274',display_name:'Helper_Nick',role:'helper',access_source:'roster',curator_id:'9001'},{telegram_id:'6004546339',display_name:'Second_Helper',role:'helper',access_source:'roster',curator_id:'9001'},{telegram_id:'9002',display_name:'Curator_Test',role:'curator',access_source:'manual'}],settings:{default_pass_score:'80',notification_hour:'12',reminder_after_hours:'24',max_self_retries:'2'},system:{maintenance_mode:false,users_count:12,lessons_count:4},audit:[{created_at:'2026-08-14T10:20:00Z',actor_id:'9001',action:'access.grant',target_id:'5155186274'}]};
    const previewReviews=[{attempt:{attempt_id:'a1',telegram_id:'5155186274',completed_at:'2026-08-21T10:00:00Z'},user:{display_name:'Helper_Nick',telegram_id:'5155186274'},bank:{name:'Входной тест'},items:[{question_id:'q1',text:'Какое нарушение показано?',answer:'Игрок совершил нарушение, необходимо зафиксировать доказательства.',criteria:'Названы нарушение, доказательства и наказание.',points:2,case:{case_id:'case-1',title:'Определите нарушение',description:'Посмотрите видеофрагмент и ответьте на вопросы.',difficulty:'hard',media_id:'media-demo'}},{question_id:'q2',text:'Какое наказание необходимо выдать?',answer:'Выдать наказание согласно регламенту.',criteria:'Указано корректное наказание.',points:1,case:{case_id:'case-1',title:'Определите нарушение',description:'Посмотрите видеофрагмент и ответьте на вопросы.',difficulty:'hard',media_id:'media-demo'}}]}];
    async function previewApi(path,body){if(path.endsWith('/bootstrap'))return structuredClone(previewState);if(path.endsWith('/reviews'))return structuredClone(previewReviews);if(path.includes('/media/')&&path.endsWith('/view-link'))return {url:'',media_type:'video',mime_type:'video/mp4',watermark:'Куратор · ID 9001'};return body||{}}
    async function api(path,body={}){if(PREVIEW)return previewApi(path,body);const response=await fetch(`${BACKEND}${path}`,{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''},body:JSON.stringify(body)}),result=await response.json().catch(()=>({status:'error',message:`HTTP ${response.status}`}));if(!response.ok||result.status!=='success')throw new Error(result.message||`Ошибка ${response.status}`);return result.data}
    function initials(value){return String(value||'ID').split(/\s+/).map(item=>item[0]||'').join('').slice(0,2).toUpperCase()}
    function setBusy(button,busy,text='Сохранение…'){if(!button)return;button.disabled=busy;if(busy){button.dataset.original=button.textContent;button.textContent=text}else button.textContent=button.dataset.original||button.textContent}
    function studentRow(item){const user=item.user||{},name=user.display_name||user.roster_nickname||user.full_name||user.username||user.telegram_id,entry=item.tests?.entry||{},final=item.tests?.final||{},tests=[entry.attempts_count?`Входной: ${entry.best_percent||0}%`:'',final.attempts_count?`Финальный: ${final.best_percent||0}%`:''].filter(Boolean).join(' · ');return `<div class="item"><div class="avatar">${esc(initials(name))}</div><div class="main"><b>${esc(name)}</b><small>ID ${esc(user.telegram_id)} · лекции: ${item.passed} из ${item.total}${item.retry_required?` · пересдач: ${item.retry_required}`:''}${tests?`<br>${esc(tests)}`:''}</small></div><div class="score">${item.progress_percent}%</div></div>`}
    function renderOverview(){const data=state.overview,c=data.counts||{};$('content').innerHTML=`<div class="toolbar"><div><h2>Результаты обучения</h2><p>Прогресс закреплённых агентов поддержки.</p></div>${state.permissions.content?'<button class="button secondary" id="openEditor">Конструктор курса →</button>':''}</div><section class="metrics"><div class="metric"><b>${data.total||0}</b><span>учеников</span></div><div class="metric"><b>${c.not_started||0}</b><span>не приступили</span></div><div class="metric"><b>${c.in_progress||0}</b><span>в процессе</span></div><div class="metric"><b>${c.passed||0}</b><span>завершили</span></div><div class="metric"><b>${c.attention||0}</b><span>требуют внимания</span></div></section><div class="panel"><div class="list">${(data.students||[]).map(studentRow).join('')||'<div class="empty">Закреплённых учеников пока нет.</div>'}</div></div>`;if($('openEditor'))$('openEditor').onclick=openEditor}
    function reviewMediaHtml(mediaId){return mediaId?`<div class="review-media" data-review-media="${esc(mediaId)}">Загружаю защищённый видеофрагмент…</div>`:''}
    function reviewAnswerHtml(answer,index,caseMediaId=''){return `<section class="review-question"><h3>${index+1}. ${esc(answer.text)}</h3>${answer.media_id&&answer.media_id!==caseMediaId?reviewMediaHtml(answer.media_id):''}<div class="answer">${esc(answer.answer)}</div><div class="criteria"><b>Критерии:</b> ${esc(answer.criteria||'Не указаны')} · ${esc(answer.points||1)} балл.</div><div class="decision"><label><input type="radio" name="${esc(answer.question_id)}" value="1" required> Засчитать</label><label><input type="radio" name="${esc(answer.question_id)}" value="0" required> Не засчитать</label></div></section>`}
    function reviewItemsHtml(items){const groups=[];(items||[]).forEach((answer,index)=>{const caseData=answer.case||{},caseId=String(caseData.case_id||'');if(!caseId){groups.push({caseData:null,answers:[{...answer,index}]});return}let group=groups.find(value=>value.caseData?.case_id===caseId);if(!group){group={caseData,answers:[]};groups.push(group)}group.answers.push({...answer,index})});return groups.map(group=>{if(!group.caseData)return group.answers.map(value=>reviewAnswerHtml(value,value.index)).join('');const caseData=group.caseData;return `<section class="review-case"><div class="review-case-label">Ситуационный кейс</div><h3>${esc(caseData.title||'Кейс')}</h3>${caseData.description?`<p>${esc(caseData.description)}</p>`:''}${reviewMediaHtml(caseData.media_id)}${group.answers.map(value=>reviewAnswerHtml(value,value.index,caseData.media_id)).join('')}</section>`}).join('')}
    function renderReviewCard(item){const attempt=item.attempt||{},user=item.user||{},lesson=item.lesson||{},bank=item.bank||{},name=user.display_name||user.roster_nickname||user.full_name||user.username||user.telegram_id;return `<form class="panel" data-review-form="${esc(attempt.attempt_id)}"><div class="row"><div><div class="title">${esc(name)}</div><div class="muted">${esc(lesson.title||bank.name||'Тест')} · ID ${esc(user.telegram_id)}</div></div><span class="tag warn">На проверке</span></div>${reviewItemsHtml(item.items)}<div class="field" style="margin-top:14px"><label>Комментарий ученику или для журнала</label><textarea class="input" name="comment" maxlength="1000"></textarea></div><div class="actions"><button class="button primary" type="submit">Завершить проверку</button></div></form>`}
    async function loadReviewMedia(){for(const box of document.querySelectorAll('[data-review-media]')){try{const media=await api(`/api/training/media/${encodeURIComponent(box.dataset.reviewMedia)}/view-link`);if(!media.url&&PREVIEW){box.innerHTML='<div class="muted">Предпросмотр защищённого видео</div>';continue}const source=esc(media.url),mime=esc(media.mime_type||'video/mp4');box.innerHTML=media.media_type==='image'?`<img src="${source}" alt="Медиа кейса" draggable="false">`:`<video controls playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture oncontextmenu="return false"><source src="${source}" type="${mime}"></video>`;if(media.watermark)box.insertAdjacentHTML('beforeend',`<span class="review-watermark">${esc(media.watermark)}</span>`)}catch(error){box.innerHTML=`<div class="error">${esc(error.message||'Не удалось открыть видео.')}</div>`}}}
    async function renderReviews(){$('content').innerHTML='<div class="loader"><div><div class="spinner"></div>Загружаю ответы…</div></div>';try{const reviews=await api('/api/training/curator/reviews');$('content').innerHTML=`<div class="toolbar"><div><h2>Проверка ответов</h2><p>Изучите кейс и видеофрагмент, затем оцените каждый открытый ответ.</p></div></div>${reviews.map(renderReviewCard).join('')||'<div class="empty">Ответов, ожидающих проверки, нет.</div>'}`;document.querySelectorAll('[data-review-form]').forEach(form=>form.onsubmit=submitReview);await loadReviewMedia()}catch(error){$('content').innerHTML=`<div class="error">${esc(error.message)}</div>`}}
    async function submitReview(event){event.preventDefault();const form=event.currentTarget,button=event.submitter,data=new FormData(form),decisions={};for(const [key,value] of data.entries())if(key!=='comment')decisions[key]=value==='1';setBusy(button,true);try{await api(`/api/training/curator/review/${encodeURIComponent(form.dataset.reviewForm)}`,{decisions,comment:data.get('comment')||''});await reload();await renderReviews()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    function accessRow(user){const canRevoke=state.manageable_roles.includes(user.role)||state.user.role==='owner',search=`${user.display_name} ${user.telegram_id}`.toLowerCase();return `<div class="item" data-access-search="${esc(search)}"><div class="avatar">${esc(initials(user.display_name))}</div><div class="main"><b>${esc(user.display_name)}</b><small>ID ${esc(user.telegram_id)} · ${esc(roleLabels[user.role]||user.role)} · ${esc(user.access_source||'manual')}${user.curator_id?` · куратор ${esc(user.curator_id)}`:''}</small></div>${canRevoke?`<button class="button small danger" data-revoke="${esc(user.telegram_id)}">Отозвать</button>`:''}</div>`}
    function renderAccess(){const users=state.users||[];$('content').innerHTML=`<div class="toolbar"><div><h2>Доступы и роли</h2><p>Ник хелпера связан с его Telegram ID.</p></div><div class="actions"><button class="button primary" id="grantAccess">Выдать доступ</button>${state.permissions.access_sync?'<button class="button secondary" id="assignCurator">Назначить куратора</button><button class="button secondary" id="syncAccess">Синхронизировать</button>':''}</div></div><input id="accessSearch" class="search" placeholder="Поиск по нику или Telegram ID"><div class="panel"><div class="list">${users.map(accessRow).join('')||'<div class="empty">Активных доступов не найдено.</div>'}</div></div>`;$('accessSearch').oninput=e=>{const query=e.target.value.toLowerCase();document.querySelectorAll('[data-access-search]').forEach(row=>row.classList.toggle('hidden',!row.dataset.accessSearch.includes(query)))};$('grantAccess').onclick=showGrantModal;if($('assignCurator'))$('assignCurator').onclick=showAssignModal;if($('syncAccess'))$('syncAccess').onclick=syncAccess;document.querySelectorAll('[data-revoke]').forEach(button=>button.onclick=()=>revokeAccess(button))}
    function showGrantModal(){showModal(`<form id="grantForm"><div class="modal-head"><h3>Новый доступ</h3><button type="button" class="close" data-close>×</button></div><div class="grid"><div class="field"><label>Telegram ID</label><input class="input" name="telegram_id" inputmode="numeric" required></div><div class="field"><label>Ник хелпера</label><input class="input" name="nickname" maxlength="200" placeholder="Nick_Name"></div><div class="field"><label>Роль</label><select class="input" name="role">${state.manageable_roles.map(role=>`<option value="${role}">${esc(roleLabels[role]||role)}</option>`).join('')}</select></div><div class="field"><label>ID куратора, если требуется</label><input class="input" name="curator_id" inputmode="numeric"></div></div><div class="form-actions"><button type="button" class="button secondary" data-close>Отмена</button><button class="button primary" type="submit">Выдать</button></div></form>`);$('grantForm').onsubmit=grantAccess}
    function showAssignModal(){const helpers=state.users.filter(user=>user.role==='helper'),curators=state.users.filter(user=>user.role==='curator');showModal(`<form id="assignForm"><div class="modal-head"><h3>Назначение куратора</h3><button type="button" class="close" data-close>×</button></div><div class="grid"><div class="field"><label>Агент поддержки</label><select class="input" name="helper_id">${helpers.map(user=>`<option value="${esc(user.telegram_id)}">${esc(user.display_name)} · ${esc(user.telegram_id)}</option>`).join('')}</select></div><div class="field"><label>Куратор</label><select class="input" name="curator_id">${curators.map(user=>`<option value="${esc(user.telegram_id)}">${esc(user.display_name)} · ${esc(user.telegram_id)}</option>`).join('')}</select></div></div><div class="form-actions"><button type="button" class="button secondary" data-close>Отмена</button><button class="button primary" type="submit">Назначить</button></div></form>`);$('assignForm').onsubmit=assignCurator}
    async function grantAccess(event){event.preventDefault();const button=event.submitter,data=Object.fromEntries(new FormData(event.currentTarget));setBusy(button,true);try{await api('/api/training/curator/access/grant',data);closeModal();await reload();renderAccess()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function revokeAccess(button){if(!confirm(`Отозвать доступ у ${button.dataset.revoke}?`))return;setBusy(button,true);try{await api('/api/training/curator/access/revoke',{telegram_id:button.dataset.revoke});await reload();renderAccess()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function assignCurator(event){event.preventDefault();const button=event.submitter,data=Object.fromEntries(new FormData(event.currentTarget));setBusy(button,true);try{await api('/api/training/curator/access/assign',data);closeModal();await reload();renderAccess()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function syncAccess(){const button=$('syncAccess');setBusy(button,true,'Синхронизация…');try{const result=await api('/api/training/curator/access/sync');await reload();renderAccess();tg?.showAlert?.(`Синхронизация завершена. В таблице: ${result.total}. Добавлено: ${result.added}. Снято: ${result.revoked||0}.`)}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    function renderSettings(){const settingRows=Object.entries(state.settings||{}).map(([key,value])=>{const label=settingLabels[key]||[key,''];return `<form class="settings-row" data-setting="${esc(key)}"><div><b>${esc(label[0])}</b><small>${esc(label[1])}</small></div><input class="input" type="number" name="value" value="${esc(value)}" required><button class="button secondary small" type="submit">Сохранить</button></form>`}).join(''),system=state.system?`<div class="panel"><h3>Состояние системы</h3><div class="grid"><div><span class="tag ${state.system.maintenance_mode?'warn':''}">${state.system.maintenance_mode?'Технические работы включены':'Система доступна'}</span><p class="main"><small>Доступов: ${state.system.users_count} · лекций: ${state.system.lessons_count}</small></p></div><div class="actions"><button class="button secondary" id="toggleMaintenance">${state.system.maintenance_mode?'Выключить техработы':'Включить техработы'}</button><button class="button secondary" id="refreshSystem">Обновить данные</button></div></div></div>`:'',audit=(state.audit||[]).length?`<div class="panel"><h3>Последние действия</h3>${state.audit.map(item=>`<div class="audit">${esc(item.action)} · ${esc(item.target_id)}<small>${esc(item.created_at)} · исполнитель ${esc(item.actor_id)}</small></div>`).join('')}</div>`:'';$('content').innerHTML=`<div class="toolbar"><div><h2>Настройки</h2><p>Параметры курса и техническое управление.</p></div>${state.permissions.content?'<button class="button secondary" id="openEditor">Конструктор курса →</button>':''}</div>${settingRows?`<div class="panel"><h3>Расписание и баллы</h3>${settingRows}</div>`:'<div class="empty">Для вашей роли доступны только личные доступы и статистика.</div>'}${system}${audit}`;document.querySelectorAll('[data-setting]').forEach(form=>form.onsubmit=saveSetting);if($('openEditor'))$('openEditor').onclick=openEditor;if($('toggleMaintenance'))$('toggleMaintenance').onclick=()=>systemAction('maintenance_toggle',$('toggleMaintenance'));if($('refreshSystem'))$('refreshSystem').onclick=()=>systemAction('refresh',$('refreshSystem'))}
    async function saveSetting(event){event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('/api/training/curator/settings/save',{key:event.currentTarget.dataset.setting,value:new FormData(event.currentTarget).get('value')});await reload();renderSettings()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    async function systemAction(action,button){setBusy(button,true);try{await api('/api/training/curator/system/action',{action});await reload();renderSettings()}catch(error){tg?.showAlert?.(error.message)}finally{setBusy(button,false)}}
    function openEditor(){const url=new URL('training-editor.html',location.href);url.search=location.search;url.hash=location.hash;location.href=url.href}
    function showModal(html){$('modal').innerHTML=`<div class="modal-card">${html}</div>`;$('modal').classList.remove('hidden');document.querySelectorAll('[data-close]').forEach(button=>button.onclick=closeModal)}function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
    async function reload(){state=await api('/api/training/curator/bootstrap');$('role').textContent=state.role_label;$('reviewBadge').textContent=state.pending_reviews_count||0}
    function switchTab(tab){activeTab=tab;document.querySelectorAll('[data-tab]').forEach(button=>button.classList.toggle('active',button.dataset.tab===tab));if(tab==='overview')renderOverview();if(tab==='reviews')renderReviews();if(tab==='access')renderAccess();if(tab==='settings')renderSettings();window.scrollTo({top:0,behavior:'smooth'})}
    async function load(){if(!PREVIEW&&!tg?.initData)throw new Error('Откройте кабинет куратора кнопкой из Telegram-бота.');await reload();document.querySelector('[data-tab="reviews"]').classList.toggle('hidden',!state.permissions.reviews);document.querySelector('[data-tab="access"]').classList.toggle('hidden',!state.permissions.access);document.querySelector('[data-tab="settings"]').classList.toggle('hidden',!(state.permissions.settings||state.permissions.system||state.permissions.audit||state.permissions.content));const visibleTabs=[...document.querySelectorAll('[data-tab]:not(.hidden)')];$('tabs').style.gridTemplateColumns=`repeat(${visibleTabs.length},1fr)`;$('loading').classList.add('hidden');$('app').classList.remove('hidden');switchTab(activeTab)}
    document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>switchTab(button.dataset.tab));
    (async()=>{try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#07101f');tg?.setBackgroundColor?.('#07101f');await load()}catch(error){$('loading').innerHTML=`<div class="error">${esc(error.message)}</div>`}})();
  </script>
</body>
