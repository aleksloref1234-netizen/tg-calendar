<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд Администратора</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Chart.js для графика -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 4px 0;
            color: var(--accent-color);
        }

        .user-role {
            font-size: 14px;
            color: var(--text-sub);
            margin: 0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-label {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .card-value {
            font-size: 18px;
            font-weight: 600;
        }

        .chart-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chart-wrapper {
            position: relative;
            height: 160px;
            width: 100%;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #3b82f6, #38bdf8);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        .blocked-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 8px;
        }

        #loading {
            text-align: center;
            padding: 30px 15px;
            font-size: 15px;
            color: var(--text-sub);
            line-height: 1.5;
            word-break: break-word;
        }
        
        .error-title {
            color: var(--danger);
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div id="loading">Загрузка данных...</div>

    <div id="content" style="display: none;">
        <!-- Хедер админа -->
        <div class="header">
            <h1 class="user-title" id="nickname">-</h1>
            <p class="user-role" id="role">-</p>
        </div>

        <!-- Прогресс повышения -->
        <div class="card" style="margin-bottom: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="card-label">Прогресс повышения</span>
                <span id="promo-percent" style="font-weight: bold; color: var(--accent-color);">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="promo-fill"></div>
            </div>
            <div id="promo-blocked" style="display: none;" class="blocked-badge"></div>
        </div>

        <!-- График активности репортов ПН-ВС -->
        <div class="chart-container">
            <div class="card-label">Репорты за неделю (ПН - ВС)</div>
            <div class="chart-wrapper">
                <canvas id="reportsChart"></canvas>
            </div>
        </div>

        <!-- Основная статистика -->
        <div class="grid-2">
            <div class="card">
                <div class="card-label">Репортов за неделю</div>
                <div class="card-value" id="reports-week">0</div>
            </div>
            <div class="card">
                <div class="card-label">Дней на должности</div>
                <div class="card-value" id="days-on-role">0</div>
            </div>
            <div class="card">
                <div class="card-label">Осталось репортов</div>
                <div class="card-value" id="reports-left">0</div>
            </div>
            <div class="card">
                <div class="card-label">Дни с момента повышения</div>
                <div class="card-value" id="days-left">0</div>
            </div>
            <div class="card">
                <div class="card-label">Дни без нормы</div>
                <div class="card-value" style="color: var(--warning);" id="days-without-norm">0</div>
            </div>
            <div class="card">
                <div class="card-label">Выполнение нормы</div>
                <div class="card-value" style="color: var(--success);" id="activity-coef">0%</div>
            </div>
        </div>

        <!-- Взыскания и Собрания -->
        <div class="grid-2">
            <div class="card">
                <div class="card-label">Выговоры / Предупреждения</div>
                <div class="card-value" style="color: var(--danger);" id="punishments">0 / 0</div>
            </div>
            <div class="card">
                <div class="card-label">Посещаемость собраний</div>
                <div class="card-value" id="meeting-percent">0%</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 🟢 Ссылка на твой Render
        const RAW_BACKEND_URL = "https://tg-admin-bot-1k1g.onrender.com"; 
        const BACKEND_URL = RAW_BACKEND_URL.replace(/\/+$/, "");

        let myChartInstance = null;

        async function loadDashboard() {
            const loadingEl = document.getElementById('loading');
            try {
                // Определяем Telegram ID пользователя
                const userId = tg.initDataUnsafe?.user?.id || "5388579854";
                const targetUrl = `${BACKEND_URL}/api/dashboard/${userId}`;

                console.log("Запрос к API:", targetUrl);

                const response = await fetch(targetUrl);

                if (!response.ok) {
                    const errorText = await response.text();
                    let errorMsg = `HTTP Error ${response.status}`;
                    try {
                        const errJson = JSON.parse(errorText);
                        if (errJson.message) errorMsg += `: ${errJson.message}`;
                    } catch(e) {}
                    
                    showError("Ошибка ответа сервера", errorMsg);
                    return;
                }

                const result = await response.json();

                if (result.status !== "success") {
                    showError("Ошибка данных", result.message || "Пользователь не найден");
                    return;
                }

                const d = result.data;

                // Заполняем данные на странице
                document.getElementById('nickname').innerText = d.nickname || "Без ника";
                document.getElementById('role').innerText = d.role || "Без должности";
                document.getElementById('reports-week').innerText = d.reports_week ?? 0;
                document.getElementById('days-on-role').innerText = d.days_on_role ?? 0;
                document.getElementById('reports-left').innerText = d.reports_left ?? 0;
                document.getElementById('days-left').innerText = d.days_left ?? 0;
                document.getElementById('days-without-norm').innerText = d.days_without_norm ?? 0;
                document.getElementById('activity-coef').innerText = (d.activity_coef ?? 0) + "%";
                document.getElementById('punishments').innerText = `${d.reprimands ?? 0} / ${d.warnings ?? 0}`;
                document.getElementById('meeting-percent').innerText = d.meeting_percent ?? "0%";

                // Рендерим прогресс повышения
                if (d.promotion) {
                    const prog = d.promotion.progress || 0;
                    document.getElementById('promo-percent').innerText = prog + "%";
                    document.getElementById('promo-fill').style.width = prog + "%";

                    if (d.promotion.is_blocked) {
                        const blockBadge = document.getElementById('promo-blocked');
                        blockBadge.style.display = "inline-block";
                        blockBadge.innerText = "⚠️ " + d.promotion.block_reason;
                    }
                }

                // Рендерим новый красивый график
                renderChart(d.reports_daily || [0,0,0,0,0,0,0]);

                // Переключаем блоки
                loadingEl.style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (err) {
                console.error("Dashboard Fetch Error:", err);
                showError("Ошибка подключения", `${err.message}. Проверь доступность сервиса.`);
            }
        }

        function showError(title, detail) {
            const loadingEl = document.getElementById('loading');
            loadingEl.innerHTML = `
                <div class="error-title">❌ ${title}</div>
                <div>${detail}</div>
            `;
        }

        function renderChart(dailyData) {
            const ctx = document.getElementById('reportsChart').getContext('2d');
            
            if (myChartInstance) {
                myChartInstance.destroy();
            }

            myChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'],
                    datasets: [{
                        label: 'Репорты',
                        data: dailyData,
                        borderColor: '#38bdf8',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        backgroundColor: function(context) {
                            const chart = context.chart;
                            const {ctx, chartArea} = chart;
                            if (!chartArea) return null;
                            const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                            gradient.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
                            gradient.addColorStop(1, 'rgba(56, 189, 248, 0.0)');
                            return gradient;
                        },
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#38bdf8',
                        pointBorderColor: '#1e293b',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleColor: '#f8fafc',
                            bodyColor: '#38bdf8',
                            borderColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 1,
                            displayColors: false,
                            callbacks: {
                                label: (context) => `Репорты: ${context.parsed.y}`
                            }
                        }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }

        loadDashboard();
    </script>
</body>
</html>
