<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд Администратора</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Chart.js для графика -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 4px 0;
            color: var(--accent-color);
        }

        .user-role {
            font-size: 14px;
            color: var(--text-sub);
            margin: 0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-label {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .card-value {
            font-size: 18px;
            font-weight: 600;
        }

        .chart-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #3b82f6, #38bdf8);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        .blocked-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 8px;
        }

        #loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div id="loading">Загрузка данных...</div>

    <div id="content" style="display: none;">
        <!-- Хедер админа -->
        <div class="header">
            <h1 class="user-title" id="nickname">-</h1>
            <p class="user-role" id="role">-</p>
        </div>

        <!-- Прогресс повышения -->
        <div class="card" style="margin-bottom: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="card-label">Прогресс повышения</span>
                <span id="promo-percent" style="font-weight: bold; color: var(--accent-color);">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="promo-fill"></div>
            </div>
            <div id="promo-blocked" style="display: none;" class="blocked-badge"></div>
        </div>

        <!-- График активности репортов ПН-ВС -->
        <div class="chart-container">
            <div class="card-label">Репорты за неделю (ПН - ВС)</div>
            <canvas id="reportsChart" height="150"></canvas>
        </div>

        <!-- Основная статистика -->
        <div class="grid-2">
            <div class="card">
                <div class="card-label">Репортов за неделю</div>
                <div class="card-value" id="reports-week">0</div>
            </div>
            <div class="card">
                <div class="card-label">Дней на должности</div>
                <div class="card-value" id="days-on-role">0</div>
            </div>
            <div class="card">
                <div class="card-label">Осталось репортов</div>
                <div class="card-value" id="reports-left">0</div>
            </div>
            <div class="card">
                <div class="card-label">Осталось дней</div>
                <div class="card-value" id="days-left">0</div>
            </div>
            <div class="card">
                <div class="card-label">Дни без нормы</div>
                <div class="card-value" style="color: var(--warning);" id="days-without-norm">0</div>
            </div>
            <div class="card">
                <div class="card-label">Выполнение нормы</div>
                <div class="card-value" style="color: var(--success);" id="activity-coef">0%</div>
            </div>
        </div>

        <!-- Взыскания и Собрания -->
        <div class="grid-2">
            <div class="card">
                <div class="card-label">Выговоры / Предупреждения</div>
                <div class="card-value" style="color: var(--danger);" id="punishments">0 / 0</div>
            </div>
            <div class="card">
                <div class="card-label">Посещаемость собраний</div>
                <div class="card-value" id="meeting-percent">0%</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем окно на весь экран

        // Укажи URL твоего опубликованного приложения на Render:
        const BACKEND_URL = "https://твой-домен.onrender.com"; 

        async function loadDashboard() {
            try {
                // Забираем user_id из инициализационных данных Telegram
                const userId = tg.initDataUnsafe?.user?.id || "5388579854"; // Фоллбэк для тестов в браузере

                const response = await fetch(`${BACKEND_URL}/api/dashboard/${userId}`);
                const result = await response.json();

                if (result.status !== "success") {
                    document.getElementById('loading').innerText = "Ошибка: " + (result.message || "Данные не найдены");
                    return;
                }

                const d = result.data;

                // Заполняем текстовые элементы
                document.getElementById('nickname').innerText = d.nickname;
                document.getElementById('role').innerText = d.role;
                document.getElementById('reports-week').innerText = d.reports_week;
                document.getElementById('days-on-role').innerText = d.days_on_role;
                document.getElementById('reports-left').innerText = d.reports_left;
                document.getElementById('days-left').innerText = d.days_left;
                document.getElementById('days-without-norm').innerText = d.days_without_norm;
                document.getElementById('activity-coef').innerText = d.activity_coef + "%";
                document.getElementById('punishments').innerText = `${d.reprimands} / ${d.warnings}`;
                document.getElementById('meeting-percent').innerText = d.meeting_percent;

                // Прогресс повышения
                if (d.promotion) {
                    const prog = d.promotion.progress;
                    document.getElementById('promo-percent').innerText = prog + "%";
                    document.getElementById('promo-fill').style.width = prog + "%";

                    if (d.promotion.is_blocked) {
                        const blockBadge = document.getElementById('promo-blocked');
                        blockBadge.style.display = "inline-block";
                        blockBadge.innerText = "⚠️ " + d.promotion.block_reason;
                    }
                }

                // Рендерим график репортов
                renderChart(d.reports_daily);

                // Показываем контент
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerText = "Ошибка загрузки данных.";
            }
        }

        function renderChart(dailyData) {
            const ctx = document.getElementById('reportsChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'],
                    datasets: [{
                        data: dailyData,
                        backgroundColor: '#38bdf8',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }

        loadDashboard();
    </script>
</body>
</html>
