<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1528">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' https://t.me https://*.telegram.org https://telegram.org https://*.telegram-cdn.org https://telegram-cdn.org; connect-src 'self' https://tg-admin-bot-1k1g.onrender.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Admin Control · Единое приложение</title>
  <link rel="stylesheet" href="admin-app.css?v=20261026-1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="admin-app-model.js?v=20261026-1" defer></script>
  <script src="admin-app.js?v=20261026-1" defer></script>
</head>
<body>
  <div id="app-gate" class="app-gate" role="status" aria-live="polite">
    <span class="gate-emblem" aria-hidden="true">AC</span>
    <h1>Admin Control</h1><p id="gate-message">Проверяем профиль и должностные доступы…</p>
    <button id="retry-bootstrap" type="button" hidden>Повторить</button>
  </div>
  <div id="admin-app" hidden>
    <header class="app-header">
      <button class="brand" type="button" data-view="home" aria-label="На главную"><span class="brand-mark">AC</span><span>ADMIN CONTROL<small id="server-label">YAROSLAVL · 68</small></span></button>
      <div class="header-actions"><button type="button" class="icon-button" data-view="notifications" aria-label="Настройки уведомлений" data-icon="bell"></button><button type="button" class="account-button" data-view="profile" aria-label="Открыть профиль"><span class="avatar avatar-small" data-avatar></span></button></div>
    </header>
    <main id="app-main" class="app-main" aria-live="polite"></main>
    <section id="module-view" class="module-view" hidden aria-label="Открытый раздел">
      <header class="module-toolbar"><button type="button" class="icon-button" id="module-back" aria-label="Назад к разделам" data-icon="arrow-left"></button><div><h1 id="module-title"></h1><p id="module-subtitle"></p></div><button type="button" class="icon-button" id="module-reload" aria-label="Обновить раздел" data-icon="refresh"></button></header>
      <div id="module-loading" class="module-loading" role="status">Открываем раздел…</div>
      <div id="module-container"></div>
    </section>
    <nav class="app-dock" aria-label="Основные разделы">
      <span class="dock-selection" aria-hidden="true"></span>
      <button type="button" data-view="home"><span data-icon="home"></span><span>Главная</span></button>
      <button type="button" data-view="catalog"><span data-icon="layout"></span><span>Разделы</span></button>
      <button type="button" data-section="additional-tasks"><span data-icon="sparkles"></span><span>Задания</span></button>
      <button type="button" data-view="profile"><span data-icon="user"></span><span>Профиль</span></button>
    </nav>
  </div>
  <dialog id="access-dialog"><div class="dialog-head"><span class="lock-symbol" data-icon="lock"></span><button type="button" class="icon-button" id="close-access" aria-label="Закрыть" data-icon="x"></button></div><h2 id="access-title">Раздел закрыт</h2><p id="access-reason"></p><button type="button" class="primary-button" id="confirm-access">Понятно</button></dialog>
  <div id="app-toast" class="app-toast" role="status" hidden></div>
  <dialog id="leave-dialog"><h2>Уйти без сохранения?</h2><p>Введённые показатели ещё не зафиксированы. При переходе они будут потеряны.</p><div class="leave-actions"><button type="button" class="primary-button" id="cancel-leave">Продолжить проверку</button><button type="button" class="text-button" id="confirm-leave">Уйти без сохранения</button></div></dialog>
</body>
</html>
